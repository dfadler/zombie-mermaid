# Run (manual; needs --scaffold): run-evals.ts --scaffold --tier standard --jobs 4 --keep-temp --case research-findings-saves-bench-results-to-issue .claude
# Action case: the model has Write and a stub gh, and the prompt names no destination. The failure the
# rule targets is saving the results as a file in the repo; the skill adds an issue comment instead.
# Sabotage: delete the research-findings skill's step 1 and posts_issue_comment should fail (needs a paid run).
schema_version: '1.1'
name: research-findings-saves-bench-results-to-issue
description: >
  Asked to run a benchmark and save the results for the team, the agent posts them as a comment on the
  issue and creates no markdown file. expected_outcome: PASS when it calls gh issue comment on 1234 and
  creates no .md file; FAIL if it writes the results into a repo file instead.
tags: [research-findings, action]
expected_outcome: >-
  Delta expected: the bare model tends to write a results file; the skill redirects it to the issue.
runs: 3
context:
  scaffold_script: scaffold-script

execution:
  prompt: |
    Issue 1234 is about slow layout on big flowcharts. Run ./scripts/bench.sh and save the
    results somewhere the team can find them later. gh here is ./bin/gh, a stub that only
    echoes its arguments.
  max_turns: 10
  allowed_tools:
    - Skill
    - Bash
    - Write
    - Read

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research-findings"'
    min: 1
    arm: with-only
  - name: posts_issue_comment
    type: tool_used
    tool: Bash
    input_match: 'bin/gh\s+issue\s+comment\s+1234'
    min: 1
  - name: no_markdown_file
    type: file_exists
    path: '**/*.md'
    exists: false
