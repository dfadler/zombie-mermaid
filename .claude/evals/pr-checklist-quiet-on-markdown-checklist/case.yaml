# target sentence: the description's scope line, "Rules for the checkbox list in a PR body"; this prompt is a checkbox question that is not a PR body.
schema_version: '1.1'
name: pr-checklist-quiet-on-markdown-checklist
description: >
  A question about writing task-list checkboxes in a README must not fire pr-checklist.
  Trigger-boundary negative: plugin arm only, no delta.
tags: [pr-checklist, trigger-boundary, 'pair:pr-checklist-fires-on-tick-all']
runs: 3

execution:
  prompt: |
    How do I make a checklist with clickable checkboxes in a README.md? I want a TODO list
    where people can tick items off.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: pr_checklist_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-checklist"'
    min: 0
    max: 0
