# CLAUDE.md rule (## "Research and measurement: findings go in the issue"), pasted inline: a plugin
# eval does not load the repo's CLAUDE.md, so the prompt carries the rule text. Keep it in sync with CLAUDE.md.
# Sabotage: delete the rule's "Do not add a docs/research/*.md doc" sentence from the pasted text and
# no_research_doc should start failing on some runs (needs a paid run to confirm). A PASS mostly shows the
# model followed the pasted rule: this is a default-behaviour guard, not evidence of plugin value.
# Single-arm by nature: no plugin supplies the rule, so there is no Δ. It is a wording-regression check:
# edit the CLAUDE.md rule, update the pasted text, and rerun to see whether the rule is still followed.
# The prompt asks for a "write-up" and names no destination, so a reply that files a doc is the temptation.
# good-reply: Post this as a comment on #1234: summary, then <details><summary>Raw timings</summary> 800 nodes 1.9 s, 3200 nodes 41 s </details>, linking https://github.com/dfadler/zombie-mermaid/blob/<sha>/scripts/bench-ascii-renderer.ts. No docs/research doc.
# bad-reply: I'll create docs/research/layout-timing.md with the results and open a PR for it.
schema_version: '1.1'
name: claude-md-findings-go-in-issue
description: >
  A measurement write-up for an issue goes in an issue comment (long parts in <details>) and not in a
  new docs/research/*.md file. expected_outcome: PASS when the reply targets an issue comment with a
  <details> block and does not propose creating a docs/research file; FAIL otherwise.
tags: [claude-md-rule, research-findings, quick]
runs: 3

execution:
  prompt: |
    Project rule from this repo's CLAUDE.md:

    > ## Research and measurement: findings go in the issue
    > For investigation, measurement or spike work on an issue, post the findings as an issue
    > comment (long ones in a collapsed `<details>`), with a permalink to any script or other
    > artifact in the repo. Do not add a `docs/research/*.md` doc: write one only when something
    > else (a guide, a code comment, a script) links to it and it is worth keeping current.

    I finished the spike on issue #1234 (layout is slow on big flowcharts). I measured with
    scripts/bench-ascii-renderer.ts, already on main: 50 nodes 12 ms, 200 nodes 95 ms, 800 nodes
    1.9 s, and 3200 nodes 41 s. Time is quadratic past 800 nodes, from the edge-crossing pass.
    That is about 60 lines of raw output. Write this up so the team can find it. Don't run
    anything; show me the text and say where it goes.
  max_turns: 4
  allowed_tools: []

graders:
  - name: targets_issue_comment
    type: regex
    target: last_message
    pattern: 'comment[^\n]{0,60}#1234|#1234[^\n]{0,60}comment'
    flags: i
  # Raw timings must sit inside the collapsed block, not only a <details> tag somewhere.
  - name: long_output_collapsed
    type: regex
    target: last_message
    pattern: '<details>\s*<summary>[\s\S]*?(?:1\.9\s*s|1,?900\s*ms)[\s\S]*?</details>'
  - name: links_script_permalink
    type: regex
    target: last_message
    pattern: '(?:github\.com|blob/)[^\s)]*scripts/bench-ascii-renderer\.ts'
    flags: i
  # Any docs/research path fails unless the reply is refusing it ("don't add", "instead of").
  - name: no_research_doc
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|\bno|\bnever|n''t|instead of|rather than|skip|avoid|without)\s(?:\w+\s){0,3})docs/research/[\w.-]+\.md'
    flags: i
    match: not_contains
