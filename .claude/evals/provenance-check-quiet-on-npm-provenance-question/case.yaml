# Smoke guard: cheap two-arm check, no expected delta.
# Near-miss: npm "provenance" vocabulary, but a general question, not the repo doc check.
schema_version: '1.1'
name: provenance-check-quiet-on-npm-provenance-question
description: No delta expected. A general npm provenance question must not fire provenance-check.
tags: [provenance-check, trigger, quick, smoke]
runs: 3
execution:
  prompt: |
    In two sentences, what does `npm publish --provenance` do?
  max_turns: 4
  allowed_tools: [Skill]
graders:
  - name: provenance_check_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?provenance-check"'
    min: 0
    max: 0
    arm: both
  - name: mentions_attestation
    type: regex
    pattern: '\b(?:attest\w*|sigstore|(?<!un)signed)\b'
    flags: i
