schema_version: '1.1'
name: research-findings-quiet-on-readme-note
description: >
  A README note after a fix is documentation, not research findings.
tags:
  - research-findings
  - trigger-boundary
  - pair:research-findings-fires-on-spike-writeup
runs: 3

execution:
  prompt: |
    Write a two-line README note explaining the new --png flag of the CLI. No other text.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: research-findings_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research-findings"'
    min: 0
    max: 0
