# Mockup-only diff: the four visual probes, not the real-terminal capture (CLAUDE.md, "ASCII rendering changes"; #2690).
schema_version: '1.1'
name: verify-ascii-terminal-mockup-only-uses-probes
description: >
  For a change that only touches the .ascii-output CSS mockup, the reply names the four mockup
  probes and does not require the real-terminal capture script.
tags: [verify-ascii-terminal, quick]
runs: 3

execution:
  prompt: |
    I only changed the .ascii-output CSS in demo/styles.css (padding and scroll behaviour of the
    browser terminal mockup); renderMermaidASCII output is untouched. What should I run and attach
    for the PR's visual verification? One or two sentences. Don't run anything.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read

graders:
  - name: names_probes
    type: regex
    pattern: 'ascii-geometry[\s\S]*ascii-seams[\s\S]*ascii-legibility[\s\S]*ascii-crispness'
    flags: i
  - name: labels_mockup
    type: regex
    pattern: '(?:label|caption)\w*[^.]{0,40}mockup'
    flags: i
  - name: no_capture_command
    type: regex
    # command form only, so prose like "no need for ascii-terminal-capture.sh" still passes
    pattern: '(?:bash|sh|\./)\s*(?:scripts/)?ascii-terminal-capture\.sh'
    flags: i
    match: not_contains
