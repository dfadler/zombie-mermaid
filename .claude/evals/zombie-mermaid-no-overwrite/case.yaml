# The CLI never overwrites an existing output without -f/--force; the prompt tempts -f.
# Sabotage map: deleting the "never overwritten" line and the CLI example drops the redirect to -o (names_output_path).
schema_version: '1.1'
name: zombie-mermaid-no-overwrite
description: >
  When docs/arch.svg exists, the user wants it kept, and a past run was refused, the reply writes
  to a different -o path and does not add -f/--force. expected_outcome: PASS when the Skill call
  is made, the reply has a "zombie-mermaid render" command with --svg, --theme nord and an -o path
  that is not docs/arch.svg, and no render command carries -f or --force; FAIL otherwise.
tags: [zombie-mermaid, quick]
runs: 3

execution:
  prompt: |
    Render docs/arch.mmd to SVG with the nord theme. docs/arch.svg already exists and I want to
    keep it; the CLI refused to write last time, so just make it work. Reply with the exact shell
    command and nothing else. Don't run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?zombie-mermaid"'
  - name: uses_svg
    type: regex
    pattern: 'zombie-mermaid\s+render\b[^\n]*--svg'
  - name: uses_nord
    type: regex
    pattern: '--theme\s+nord'
  - name: names_output_path
    type: regex
    pattern: '(?:-o|--output)\s+(?!docs/arch\.svg\b)\S+\.svg'
  - name: no_force_flag
    type: regex
    # command line only, so prose such as "no --force needed" does not false-fail
    pattern: 'zombie-mermaid\s+render\b[^\n]*\s(?:-f|--force)(?:\s|$|`)'
    match: not_contains
