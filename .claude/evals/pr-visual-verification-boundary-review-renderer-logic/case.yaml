# near-miss: names a rendering path or PR step but wants something else; the skill should stay quiet.
schema_version: '1.1'
name: pr-visual-verification-boundary-review-renderer-logic
description: >
  Trigger-boundary negative paired with pr-visual-verification-fires-section-shape. expected_outcome: PASS when the reply does not
  invoke the pr-visual-verification skill; FAIL if it fires. Guards the description phrase "any
  change that could alter a rendered result" from broadening. Plugin arm only, no delta expected.
tags:
  - pr-visual-verification
  - trigger-boundary
  - quick
  - 'pair:pr-visual-verification-fires-section-shape'
runs: 1

execution:
  prompt: |
    Review my diff to packages/svg-renderer/src/edge-label.ts for logic bugs only: off-by-one errors, null handling, bad rounding. Here is the hunk: `const dx = (b.x - a.x) / 2 | 0; return a.x + dx`. Don't run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_stays_quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-visual-verification"'
    min: 0
    max: 0
