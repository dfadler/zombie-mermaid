# Should-not-fire near-miss: conceptual mermaid.js question, no diagram to render.
# Regression guard, delta 0 by design, tagged smoke.
schema_version: '1.1'
name: zm-quiet-on-mermaid-concepts
description: >
  A conceptual question about how mermaid.js parses subgraphs wants an explanation, not a
  render; the zombie-mermaid skill must not fire. expected_outcome: PASS when the skill is not
  invoked; FAIL when it is. Regression guard: Delta 0 by design.
tags: [zombie-mermaid, trigger, smoke, quick]

execution:
  prompt: |
    Explain in two sentences how mermaid.js parses nested subgraphs. No diagram needed.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: zombie_mermaid_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?zombie-mermaid"'
    min: 0
    max: 0
    arm: both
