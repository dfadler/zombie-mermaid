<polyline class="edge edge-animated" data-from="SVG" data-to="Theme" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-id="e6" points="326.83399999999995,58.45 355.28,58.45 355.28,90.9 377.798,90.9" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="8 6" marker-end="url(#arrowhead)" />
<polyline class="edge edge-animated" data-from="ASCII" data-to="Theme" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-id="e7" points="332.76199999999994,123.35000000000001 355.28,123.35000000000001 355.28,90.9 377.798,90.9" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="8 6" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="Layout" data-to="SVG" data-label="Vector">
  <rect x="167.446" y="42.45" width="49.726" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="192.309" y="57.6" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Vector</text>
</g>
<g class="edge-label" data-from="Layout" data-to="ASCII" data-label="Text">
  <rect x="172.20999999999998" y="107.35000000000001" width="39.034000000000006" height="30.3" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="191.72699999999998" y="122.50000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)" dy="3.8499999999999996">Text</text>
