  <text x="40" y="206" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#6e7681">e4@{</tspan> <tspan style="fill:#e6edf3">animate</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">true</tspan> <tspan style="fill:#6e7681">}</tspan></text>
  <text x="40" y="230" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#6e7681">e5@{</tspan> <tspan style="fill:#e6edf3">animate</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">true</tspan> <tspan style="fill:#6e7681">}</tspan></text>
  <text x="40" y="254" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#6e7681">e6@{</tspan> <tspan style="fill:#e6edf3">animate</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">true</tspan> <tspan style="fill:#6e7681">}</tspan></text>
  <text x="40" y="278" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#6e7681">e7@{</tspan> <tspan style="fill:#e6edf3">animate</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">true</tspan> <tspan style="fill:#6e7681">}</tspan></text>

<!-- "Renders as" arrow -->
<defs>
  <linearGradient id="hero-readme-arrow-grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9570BE"/>
    <stop offset="1" stop-color="#3b82f6"/>
  </linearGradient>
</defs>
<g transform="translate(320, 340)">
  <line x1="0" y1="0" x2="0" y2="20" stroke="url(#hero-readme-arrow-grad)" stroke-width="2.5" stroke-linecap="round" class="hero-readme-arrow-dash"/>
  <path d="M-10 14 L0 28 L10 14" stroke="url(#hero-readme-arrow-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>

<!-- "After": the actual rendered, animated diagram -->
<svg x="90" y="388" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 499.76199999999994 182.5" width="460" height="167.9799584602271" role="img" style="--bg:#FFFFFF;--fg:#27272A">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<style>
  @keyframes zm-edge-dash { to { stroke-dashoffset: -28; } }
  .edge-animated { animation: zm-edge-dash 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .edge-animated { animation: none; }
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge edge-animated" data-from="Layout" data-to="SVG" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="Vector" data-id="e4" points="123.446,84.75 159.446,84.75 159.446,58.45 258.20799999999997,58.45" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="8 6" marker-end="url(#arrowhead)" />
