  <text x="40" y="110" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#e6edf3">Layout</tspan> <tspan style="fill:#6e7681">e4@--&gt;</tspan> <tspan style="fill:#e6edf3">SVG</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">Vector</tspan></text>
  <text x="40" y="134" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#e6edf3">Layout</tspan> <tspan style="fill:#6e7681">e5@--&gt;</tspan> <tspan style="fill:#e6edf3">ASCII</tspan><tspan style="fill:#6e7681">:</tspan> <tspan style="fill:#ffa657">Text</tspan></text>
  <text x="40" y="158" font-size="13" style="font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace"><tspan style="fill:#e6edf3">SVG</tspan> <tspan style="fill:#6e7681">e6@--&gt;</tspan> <tspan style="fill:#e6edf3">Theme</tspan></text>
