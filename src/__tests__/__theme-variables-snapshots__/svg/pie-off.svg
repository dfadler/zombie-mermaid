<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 557 450" width="557" height="450" role="img" style="--bg:#FFFFFF;--fg:#27272A;--muted:#71717A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
  @media (prefers-contrast: more) {
    svg { --_node-stroke: var(--fg); --_inner-stroke: var(--fg); --_line: var(--fg); --_arrow: var(--fg); --_text-sec: var(--fg); --_text-muted: var(--fg); --_text-faint: var(--fg); }
  }
  @media (forced-colors: active) {
    svg { --_node-stroke: CanvasText; --_inner-stroke: CanvasText; --_line: CanvasText; --_arrow: CanvasText; --_text-sec: CanvasText; --_text-muted: CanvasText; --_text-faint: CanvasText; }
  }
</style>
<style>
  .pie-outer { fill: none; stroke: var(--fg); stroke-width: 2px; }
  .pie-slice { stroke: var(--fg); stroke-width: 2px; opacity: 0.7; }
  .pie-slice-label { fill: var(--_text); font-size: 17px; font-weight: 400; }
  .pie-title { fill: var(--_text); font-size: 25px; font-weight: 400; }
  .pie-legend-text { fill: var(--_text); font-size: 17px; font-weight: 400; }
  svg {
    --pie-color-0: var(--accent, #3b82f6);
    --pie-color-1: #0d5ba5;
    --pie-color-2: #5fb4f2;
  }
  .pie-color-0 { fill: var(--pie-color-0); }
  rect.pie-color-0 { stroke: var(--pie-color-0); }
  .pie-color-1 { fill: var(--pie-color-1); }
  rect.pie-color-1 { stroke: var(--pie-color-1); }
  .pie-color-2 { fill: var(--pie-color-2); }
  rect.pie-color-2 { stroke: var(--pie-color-2); }
</style>
<circle cx="225" cy="225" r="186" class="pie-outer"/>
<path d="M225,40A185,185,0,0,1,333.74,374.67L225,225Z" class="pie-slice pie-color-0" data-label="Dogs" data-value="40"/>
<path d="M333.74,374.67A185,185,0,0,1,40,225L225,225Z" class="pie-slice pie-color-1" data-label="Cats" data-value="35"/>
<path d="M40,225A185,185,0,0,1,225,40L225,225Z" class="pie-slice pie-color-2" data-label="Rats" data-value="25"/>
<text x="356.96" y="182.12" text-anchor="middle" class="pie-slice-label">40%</text>
<text x="162.01" y="348.63" text-anchor="middle" class="pie-slice-label">35%</text>
<text x="126.89" y="126.89" text-anchor="middle" class="pie-slice-label">25%</text>
<text x="225" y="25" text-anchor="middle" class="pie-title">Pets</text>
<g class="pie-legend"><rect x="441" y="192" width="18" height="18" class="pie-legend-swatch pie-color-0"/><text x="463" y="206" class="pie-legend-text">Dogs</text></g>
<g class="pie-legend"><rect x="441" y="214" width="18" height="18" class="pie-legend-swatch pie-color-1"/><text x="463" y="228" class="pie-legend-text">Cats</text></g>
<g class="pie-legend"><rect x="441" y="236" width="18" height="18" class="pie-legend-swatch pie-color-2"/><text x="463" y="250" class="pie-legend-text">Rats</text></g>
</svg>