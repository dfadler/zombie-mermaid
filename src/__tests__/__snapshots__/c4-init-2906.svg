<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 482.05" width="1490" height="482.05" role="img" style="--bg:#FFFFFF;--fg:#27272A;--muted:#71717A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
  @media (prefers-contrast: more) {
    svg { --_node-stroke: var(--fg); --_inner-stroke: var(--fg); --_line: var(--fg); --_arrow: var(--fg); --_text-sec: var(--fg); --_text-muted: var(--fg); --_text-faint: var(--fg); }
  }
  @media (forced-colors: active) {
    svg { --_node-stroke: CanvasText; --_inner-stroke: CanvasText; --_line: CanvasText; --_arrow: CanvasText; --_text-sec: CanvasText; --_text-muted: CanvasText; --_text-faint: CanvasText; }
  }
</style>
<g class="c4-element" data-id="u" data-kind="person" data-shape="default" data-external="false" data-label="User">
  <path class="c4-person-shape" d="M 258.68 273.88 H 321.73 A 56 56 0 1 1 398.27 273.88 H 461.32 A 48.68 48.68 0 0 1 510 322.56 V 333.37 A 48.68 48.68 0 0 1 461.32 382.05 H 258.68 A 48.68 48.68 0 0 1 210 333.37 V 322.56 A 48.68 48.68 0 0 1 258.68 273.88 Z" fill="#08427b" stroke="#073b6f" stroke-width="2" />
  <text x="360" y="311.56" text-anchor="middle" dy="0.35em" font-size="14" font-weight="700" fill="#ffffff">User</text>
  <text x="360" y="327.09" text-anchor="middle" dy="0.35em" font-size="10.5" fill="#ffffff">[Person]</text>
  <text x="360" y="343.5" text-anchor="middle" dy="0.35em" font-size="11.5" fill="#ffffff">Uses the system</text>
</g>
<g class="c4-element" data-id="s" data-kind="system" data-shape="default" data-external="false" data-label="System">
  <rect x="610" y="177" width="300" height="108.17" rx="12" ry="12" fill="#1168bd" stroke="#3c7fc0" stroke-width="2" />
  <text x="760" y="214.68" text-anchor="middle" dy="0.35em" font-size="14" font-weight="700" fill="#ffffff">System</text>
  <text x="760" y="230.21" text-anchor="middle" dy="0.35em" font-size="10.5" fill="#ffffff">[Software System]</text>
  <text x="760" y="246.62" text-anchor="middle" dy="0.35em" font-size="11.5" fill="#ffffff">Does the work in a long description</text>
</g>
<g class="c4-element" data-id="e" data-kind="system" data-shape="default" data-external="true" data-label="Email">
  <rect x="1010" y="177" width="300" height="91.07" rx="12" ry="12" fill="#999999" stroke="#8a8a8a" stroke-width="2" />
  <text x="1160" y="214.68" text-anchor="middle" dy="0.35em" font-size="14" font-weight="700" fill="#ffffff">Email</text>
  <text x="1160" y="230.21" text-anchor="middle" dy="0.35em" font-size="10.5" fill="#ffffff">[Software System]</text>
</g>
<path class="c4-relationship" data-from="u" data-to="s" data-label="Uses" d="M 407.11,274.38 L 610,249.25" fill="none" stroke="var(--_text)" stroke-width="1" />
<polygon class="c4-arrowhead" points="610,249.25 600.69,255.44 599.46,245.52" fill="var(--_text)" />
<path class="c4-relationship" data-from="s" data-to="e" data-label="Sends" d="M 910,227.88 Q 935,226.81 1010,225.74" fill="none" stroke="var(--_text)" stroke-width="1" />
<polygon class="c4-arrowhead" points="1010,225.74 1000.07,230.88 999.93,220.88" fill="var(--_text)" />
<g class="c4-relationship-label" data-from="u" data-to="s">
  <rect class="c4-label-plate" x="515.48" y="253.59" width="33.34" height="14" rx="2" ry="2" fill="var(--bg)" />
  <text x="532.15" y="260.59" text-anchor="middle" dy="0.35em" font-size="12" fill="var(--_text)">Uses</text>
</g>
<g class="c4-relationship-label" data-from="s" data-to="e">
  <rect class="c4-label-plate" x="957" y="219.81" width="40.03" height="14" rx="2" ry="2" fill="var(--bg)" />
  <text x="977.01" y="226.81" text-anchor="middle" dy="0.35em" font-size="12" fill="var(--_text)">Sends</text>
</g>
</svg>