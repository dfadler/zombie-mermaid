<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 381.77424999999994 116.9" width="381.77424999999994" height="116.9" role="img" style="--bg:#18181B;--fg:#FAFAFA;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="A" data-to="B" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="168.95821999999998,58.45 216.95821999999998,58.45" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node external" data-id="A" data-label="External User" data-shape="rectangle">
  <rect x="40" y="40" width="128.95821999999998" height="36.900000000000006" rx="0" ry="0" fill="#FF6B6B" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="104.47910999999999" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#000000" dy="4.55">External User</text>
</g>
<g class="node api" data-id="B" data-label="API Gateway" data-shape="rectangle">
  <rect x="216.95821999999998" y="40" width="124.81602999999998" height="36.900000000000006" rx="0" ry="0" fill="#90EE90" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="279.36623499999996" y="58.45" text-anchor="middle" font-size="13" font-weight="500" fill="#000000" dy="4.55">API Gateway</text>
</g>
</svg>