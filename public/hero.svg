<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="Raw Mermaid source rendering into a themed, animated diagram, drawn by zombie-mermaid itself">
<style>
  :root { --bg: #0a0d16; --bg-soft: #10152a; --panel: #141a2e; --panel-2: #181f38; --border: #2a3252; --text: #eef1fb; --text-dim: #9aa3c4; --text-faint: #6b7398; --blue: #4d8dff; --violet: #a374e8; --cyan: #38e0d0; --pink: #ff5fa8; --amber: #ffb84d; --green: #3ee08a; }
  /* This file is loaded via a plain img element, so — unlike the same
     shapes when they lived inline in HeroVisual (demo/components/index-app.tsx)
     — it has no host page to inherit `:root` custom properties, the
     `.mono` font-family, or the `.edge-anim` marching-ants animation
     from. All three are restated here, sourced from the same values
     (tokens.tsx's COLORS/FONTS, index-page.tsx's homePageCss()) so this
     renders identically to how it rendered inline. */
  .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  @keyframes marchingAnts { to { stroke-dashoffset: -24; } }
  .edge-anim { stroke-dasharray: 6 6; animation: marchingAnts 0.9s linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .edge-anim { animation: none; }
  }
</style>
<rect x="0" y="0" width="700" height="460" rx="20" fill="var(--bg)"/>
<rect x="20" y="50" width="298" height="320" rx="16" fill="var(--panel)" stroke="var(--border)" stroke-width="1.5"></rect><circle cx="42" cy="72" r="5" fill="#ff6767"></circle><circle cx="60" cy="72" r="5" fill="#ffc85c"></circle><circle cx="78" cy="72" r="5" fill="#5ee08a"></circle><text x="36" y="110" class="mono" font-size="13" fill="var(--text-faint)">graph TD</text><text x="36" y="136" class="mono" font-size="13" fill="var(--text-dim)">  Start <tspan fill="var(--text-faint)">e1@</tspan>--&gt; <tspan fill="var(--violet)">Deploy</tspan>{Deploy?}</text><text x="36" y="162" class="mono" font-size="13" fill="var(--text-dim)">  Deploy <tspan fill="var(--text-faint)">e2@</tspan>--&gt;|<tspan fill="var(--green)">yes</tspan>| <tspan fill="var(--amber)">Ship</tspan>[Ship it]</text><text x="36" y="188" class="mono" font-size="13" fill="var(--text-dim)">  Deploy <tspan fill="var(--text-faint)">e3@</tspan>--&gt;|<tspan fill="var(--pink)">no</tspan>| <tspan fill="var(--amber)">Iterate</tspan>[Iterate]</text><text x="36" y="214" class="mono" font-size="13" fill="var(--text-faint)">  e1@{ <tspan fill="var(--text-dim)">animate</tspan>: <tspan fill="var(--amber)">true</tspan> }</text><text x="36" y="240" class="mono" font-size="13" fill="var(--text-faint)">  e2@{ <tspan fill="var(--text-dim)">animate</tspan>: <tspan fill="var(--amber)">true</tspan> }</text><text x="36" y="266" class="mono" font-size="13" fill="var(--text-faint)">  e3@{ <tspan fill="var(--text-dim)">animate</tspan>: <tspan fill="var(--amber)">true</tspan> }</text><path d="M318 210 C 360 210 390 90 400 75 L420 75" stroke="var(--cyan)" stroke-width="2.5" fill="none" class="edge-anim" marker-end="url(#arrowCyan)"></path><rect x="430" y="50" width="140" height="50" rx="25" fill="var(--blue)"></rect><text x="500" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#081018">Start</text><path d="M500 100 L500 130" stroke="var(--cyan)" stroke-width="2.5" fill="none" class="edge-anim" marker-end="url(#arrowCyan)"></path><polygon points="500,140 565,175 500,210 435,175" fill="var(--violet)"></polygon><text x="500" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bg)">Deploy?</text><path d="M435 175 C 390 225 410 265 435 291" stroke="var(--green)" stroke-width="2.5" fill="none" class="edge-anim" marker-end="url(#arrowGreen)"></path><text x="378" y="240" font-size="12" fill="var(--green)" class="mono">yes</text><path d="M565 175 C 610 225 592 265 602 289" stroke="var(--pink)" stroke-width="2.5" fill="none" class="edge-anim" marker-end="url(#arrowPink)"></path><text x="600" y="240" font-size="12" fill="var(--pink)" class="mono">no</text><rect x="382" y="300" width="130" height="50" rx="12" fill="var(--green)"></rect><text x="447" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#081018">Ship it</text><rect x="546" y="300" width="130" height="50" rx="12" fill="var(--pink)"></rect><text x="611" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#2a0a18">Iterate</text><defs><marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--cyan)"></path></marker><marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--green)"></path></marker><marker id="arrowPink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--pink)"></path></marker></defs>
</svg>
