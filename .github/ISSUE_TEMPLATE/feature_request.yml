name: Feature Request
description: Suggest an idea or improvement for zombie-mermaid
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! The more context you can give, the easier it is to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? Is this related to a diagram type, theming, output format, or something else?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Include example API usage or a sample diagram if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions, workarounds, or existing features you've tried instead.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, related issues/PRs (including any stuck upstream in `lukilabs/beautiful-mermaid`).
    validations:
      required: false
