name: Bug Report
description: Report a problem with rendering, theming, or output correctness
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much of this as you can — the Mermaid source and expected/actual output are the most important parts.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: diagram-source
    attributes:
      label: Mermaid diagram source
      description: >
        Paste the raw Mermaid syntax that triggers the bug (the string you pass to
        `renderMermaidSVG` / `renderMermaidASCII` / `renderMermaidSVGAsync`). Please
        paste it as plain text, not a screenshot.
      placeholder: |
        graph TD
          A[Start] --> B{Decision}
          B -->|Yes| C[Action]
          B -->|No| D[End]
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What did you expect the rendered SVG/ASCII to look like?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: >
        What actually happened? Paste any error message/stack trace here, or
        describe (and/or attach a screenshot of) the incorrect rendering.
    validations:
      required: true

  - type: dropdown
    id: output-format
    attributes:
      label: Output format
      description: Which renderer were you using?
      options:
        - SVG (renderMermaidSVG / renderMermaidSVGAsync)
        - ASCII (renderMermaidASCII)
        - Both
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: zombie-mermaid version
      description: Run `npm ls zombie-mermaid` or check your lockfile.
      placeholder: 'e.g. 1.1.3 (current latest)'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: 'e.g. v22.22.1'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. macOS 15.1, Ubuntu 22.04, Windows 11'
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help — render options passed (theme, bg/fg, etc.), browser, framework (React/Node/Bun), links, etc.
    validations:
      required: false
