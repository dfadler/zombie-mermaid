version: 2
updates:
  - package-ecosystem: github-actions
    # The composite action's pins are not under /.github/workflows, so list it.
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
  # plugins/claude has its own npm-shrinkwrap.json (#2503); pnpm's
  # minimumReleaseAge/trustPolicy do not cover it, so this cooldown does.
  # It also bumps the zombie-mermaid pin itself (#2504).
  - package-ecosystem: npm
    directory: /plugins/claude
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
