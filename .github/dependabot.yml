version: 2
updates:
  - package-ecosystem: github-actions
    # The composite action's pins are not under /.github/workflows, so list it.
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
