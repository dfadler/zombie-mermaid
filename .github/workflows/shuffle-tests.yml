name: Shuffled tests

# Nightly Vitest run with file and test order shuffled (#1837), so order-dependent
# tests surface here instead of as flakes. Not a required check and not a PR
# trigger: a red run is the alert. Reproduce locally with the seed printed in
# the log:
#   pnpm run test:shuffle --sequence.seed=<seed>
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Shuffle seed (blank = random)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shuffle:
    name: Unit tests (shuffled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'dfadler/zombie-mermaid'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js and install
        uses: ./.github/actions/setup

      - name: Run tests with shuffled order
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          set -uo pipefail
          SEED="${INPUT_SEED:-$RANDOM$RANDOM}"
          echo "::notice title=Shuffle seed::$SEED (repro: pnpm run test:shuffle --sequence.seed=$SEED)"
          pnpm run test:shuffle --sequence.seed="$SEED"
