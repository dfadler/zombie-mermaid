name: Layout oracle

# Weekly layout-fidelity scorecard against the pinned mermaid (#2037, umbrella
# #1502). Runs scripts/layout-oracle.ts --thresholds in headless Chromium and
# reports any sample that fell below its floor. Scheduled only, never on
# pull_request: it needs Chromium, takes minutes, and the pinned mermaid does not
# change per PR, so it cannot fail an unrelated PR.
#
# Reporting (least noisy): the job goes red on a breach, the run summary carries
# the table, the JSON is an artifact, and ONE open issue labelled `layout-oracle`
# is created on the first breach and edited in place afterwards (no comment
# per week, no second issue). It never pushes to main. The same run also
# appends to layout-fidelity-history.jsonl and regenerates
# docs/layout-fidelity-scorecard.md (what `pnpm run layout:scorecard` does),
# and the `open-pr` job ships both as ONE bot PR on the stable branch
# chore/layout-oracle-refresh (#1686). A human merges it; the PR touches no
# workflow file. Same two-job shape and DASHBOARD_REFRESH_PAT as
# dashboard-refresh.yml (see its header for why a PAT, and why the PAT job
# never runs `pnpm install`). The pin is not bumped or bypassed here: the
# min-release-age guard applies, and a stale pin shows up in the summary.
on:
  schedule:
    - cron: '47 6 * * 1' # Monday, staggered from the other weekly crons
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: layout-oracle
  cancel-in-progress: false

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'dfadler/zombie-mermaid'
    outputs:
      breach: ${{ steps.report.outputs.breach }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js and install
        uses: ./.github/actions/setup
        with:
          node-version: '24'

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The oracle's exit code (1 = breach) is re-raised by the last step so the
      # report and artifact still run.
      - name: Run layout oracle
        id: oracle
        continue-on-error: true
        run: >-
          pnpm exec tsx scripts/layout-oracle.ts --thresholds
          --scorecard-json=layout-scorecard.json
          --history=layout-fidelity-history.jsonl
          --scorecard=docs/layout-fidelity-scorecard.md

      # layout:scorecard formats the doc the same way; do it here so the PAT job
      # below needs no toolchain.
      - name: Format scorecard doc
        if: always()
        run: pnpm exec oxfmt docs/layout-fidelity-scorecard.md

      - name: Report
        id: report
        if: always()
        run: |
          rc=0
          node scripts/layout-oracle-report.mjs layout-scorecard.json > layout-oracle-report.md || rc=$?
          {
            echo '## Layout oracle'
            echo
            cat layout-oracle-report.md
            echo
            pnpm exec tsx scripts/lib/mermaid-pin-freshness.ts || true
          } >> "$GITHUB_STEP_SUMMARY"
          # rc 1 = floor breach (the issue job runs); 2 = no scorecard, the oracle step's own failure is the signal
          if [ "$rc" = 1 ]; then echo 'breach=true' >> "$GITHUB_OUTPUT"; else echo 'breach=false' >> "$GITHUB_OUTPUT"; fi

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-scorecard
          path: |
            layout-scorecard.json
            layout-oracle-report.md
            layout-fidelity-history.jsonl
            docs/layout-fidelity-scorecard.md
          retention-days: 90
          if-no-files-found: warn

      - name: Fail on breach
        if: steps.oracle.outcome == 'failure'
        run: |
          echo 'layout oracle failed or found floor breaches; see the summary' >&2
          exit 1

  issue:
    needs: oracle
    if: always() && needs.oracle.outputs.breach == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-scorecard

      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly layout oracle found samples below their floor. Run: $RUN_URL (scorecard JSON attached as an artifact)."
            echo "This issue is edited in place each run and can be closed once the floors hold."
            echo
            cat layout-oracle-report.md
          } > body.md
          gh label create layout-oracle --color BFD4F2 --description 'Layout oracle floor breach' 2>/dev/null || true
          n=$(gh issue list --label layout-oracle --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body.md
          else
            gh issue create --title 'Layout oracle: floors breached' --label layout-oracle --body-file body.md
          fi

  open-pr:
    needs: oracle
    # The oracle job goes red on a floor breach but still uploads the refreshed
    # history, so run on success or failure (not skipped/cancelled).
    if: >-
      always() && github.repository == 'dfadler/zombie-mermaid' &&
      (needs.oracle.result == 'success' || needs.oracle.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately no `pnpm install` here: the PAT is in this job's
      # environment (see dashboard-refresh.yml's header).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: layout-scorecard

      - name: Commit, push, and open or update the PR
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_REFRESH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DASHBOARD_REFRESH_PAT secret is not set; see dashboard-refresh.yml's header comment."
            exit 1
          fi

          if git diff --quiet -- layout-fidelity-history.jsonl docs/layout-fidelity-scorecard.md; then
            echo 'No change to the history or scorecard; not opening a PR.'
            exit 0
          fi

          # One stable branch, rebuilt from main each run: a still-open PR from a
          # previous week is replaced by this run's history line, not stacked.
          BRANCH=chore/layout-oracle-refresh
          # Data-only PR: CI's "Changeset present" check exempts only demo/,
          # badges/ and bench-history.jsonl, so carry an empty changeset.
          printf -- '---\n---\n' > .changeset/layout-oracle-refresh.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add layout-fidelity-history.jsonl docs/layout-fidelity-scorecard.md .changeset/layout-oracle-refresh.md
          git commit -m 'chore: weekly layout-fidelity history and scorecard'
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          # The force-push re-runs CI on an open PR (PAT-authored); only create when none is open.
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title 'chore: weekly layout-fidelity history and scorecard' \
              --body "Automated weekly refresh of layout-fidelity-history.jsonl and docs/layout-fidelity-scorecard.md (layout-oracle.yml, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Empty changeset. Merge once checks pass."
          fi
