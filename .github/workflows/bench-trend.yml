# Runs bench.ts against main on a schedule and appends the result to the
# tracked trend history (bench-history.jsonl), so performance drift is
# visible across weeks/months (pnpm run bench:trend) without depending on
# how often main happens to get pushed to.
#
# This used to run from ci.yml's `bench` job on every push to main instead
# of on a schedule. That meant every merged PR — not just ones that touched
# anything performance-relevant — spawned its own "record benchmark trend
# entry" PR. In a repo that merges many PRs a day, that produced far more
# trend PRs than any maintainer could keep up with: 24 were open at once,
# and none had ever been merged, which is what prompted this redesign. A
# weekly cadence matches what scripts/bench-history-append.ts's own header
# comment already assumed ("roughly 10/week for a year") and turns "merge a
# trend PR every time anyone merges anything" into "merge one trend PR a
# week."
#
# Same shape as dashboard-refresh.yml (weekly cron + workflow_dispatch, fork
# guard, split generate/open-pr jobs, PAT-authored PR so its checks actually
# run) — see that workflow's header for the full rationale behind each of
# those choices; this one follows it rather than re-deriving it.
#
# Deliberately does NOT skip the PR when the appended entry "looks similar"
# to the last one, unlike dashboard-refresh.yml's diff check: a trend
# history is a time series, so a new weekly data point is the point of the
# run, not noise to be deduplicated away.
#
# Requires the same DASHBOARD_REFRESH_PAT repo secret dashboard-refresh.yml
# uses (Contents: Read and write + Pull requests: Read and write) — the
# default GITHUB_TOKEN can't author a PR whose checks then actually run.
# See dashboard-refresh.yml's header for how to set it; nothing additional
# is needed since it's already a repo secret.

name: Benchmark trend recording

on:
  schedule:
    # Weekly, offset from upstream-check.yml (Monday 13:00 UTC) and
    # dashboard-refresh.yml (Monday 14:00 UTC) so the three don't contend
    # for the same runner minute.
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same fork-of-this-fork guard used elsewhere (see ci.yml's `test` job
    # for the full reasoning) — without it, a workflow_dispatch run in a
    # downstream fork would open a trend PR against that fork's own main,
    # which is harmless but pointless noise for the fork owner.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: pnpm run bench -- --json=bench-current.json

      # No --commit=/--ref= flags: scripts/bench-history-append.ts already
      # falls back to $GITHUB_SHA/$GITHUB_REF, which every Actions job sets
      # automatically. Passing github.sha/github.ref via `${{ }}`
      # interpolation into a `run:` step instead would inject untrusted
      # `github` context data straight into the shell command line (flagged
      # by this repo's Semgrep SAST scan, yaml.github-actions.security.
      # run-shell-injection) — reading them as plain env vars avoids that
      # entirely, with no `env:` indirection needed since the script reads
      # them itself.
      - name: Append to trend history
        run: pnpm run bench:history:append -- bench-current.json

      - name: Upload updated trend history
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-history-updated
          path: bench-history.jsonl
          retention-days: 1

  open-pr:
    name: Open PR
    needs: run-benchmark
    if: github.repository == 'dfadler/zombie-mermaid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # pushes via DASHBOARD_REFRESH_PAT below, not the job token

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Deliberately no `pnpm install` (or anything else that executes
      # third-party code) in this job — the repo-writing PAT below must
      # never share a job with a dependency lifecycle script that could
      # read it out of the environment. See dashboard-refresh.yml's header
      # for the full incident this guards against. The empty changeset is
      # written by hand for the same reason: `pnpm changeset add --empty`
      # needs the changesets CLI installed.
      - name: Download updated trend history
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-history-updated

      - name: Commit, push, and open PR
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_REFRESH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DASHBOARD_REFRESH_PAT secret is not set — see dashboard-refresh.yml's header comment for why the default GITHUB_TOKEN can't be used here."
            exit 1
          fi

          # Empty changeset satisfies the "Changeset present" required
          # check without claiming a version bump — a trend-data append
          # isn't a release-worthy change. Same pattern dashboard-
          # refresh.yml already uses for its own data-only PRs.
          mkdir -p .changeset
          printf -- '---\n---\n' > ".changeset/bench-history-${GITHUB_RUN_ID}.md"

          # Suffixed with the run id (not just the date) so a manual
          # workflow_dispatch alongside the weekly cron, or a rerun, never
          # collides on branch name and gets rejected as non-fast-forward
          # against an already-open trend PR's branch.
          BRANCH="chore/bench-history-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add bench-history.jsonl .changeset
          git commit -m 'chore: record benchmark trend entry'

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title 'chore: record benchmark trend entry' \
            --body 'Automated weekly append of bench.ts'"'"'s summary to bench-history.jsonl, via bench-trend.yml. Includes an empty changeset -- this is a data snapshot, not a release-worthy change. Merge once checks pass. Run pnpm run bench:trend to see the trend report.'
