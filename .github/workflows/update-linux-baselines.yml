# Regenerates the Linux visual baselines inside the same pinned container image
# CI gates on, and pushes them to the chosen branch. All git work runs on the
# host runner (the image has no git, #1711); only the Playwright run uses the
# image, via `docker run` against the shared checkout. macOS agents can't produce
# these (scripts/docker-test-visual.sh only checks), so this stops them being
# deferred (#1577).
#
# Run: Actions > update-linux-baselines > Run workflow, pick the PR branch.
# Pushes with the BASELINES_PUSH_TOKEN secret (a fine-grained PAT or GitHub App
# token with Contents: write), not GITHUB_TOKEN: a GITHUB_TOKEN push does not
# trigger CI, and runs attributed to github-actions[bot] wait for manual approval.
name: update-linux-baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-linux-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'dfadler/zombie-mermaid' && github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BASELINES_PUSH_TOKEN }}

      - name: Merge main first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate Linux baselines
        env:
          IMAGE: ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only@sha256:aa9d5b32ea243e0f6880c5ad7b4fbb1ab863e97d271a215f5bd966aa58a605d5 # keep in sync with ci.yml's visual-regression job
        run: |
          docker run --rm --ipc=host -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$IMAGE" node_modules/.bin/playwright test --update-snapshots

      - name: Commit and push
        run: |
          git add __tests__/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi
          git commit -m "test(visual): regenerate Linux baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
