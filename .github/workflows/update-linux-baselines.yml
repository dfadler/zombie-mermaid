# Regenerates the Linux visual baselines inside the same pinned container image
# CI gates on, and pushes them to the chosen branch. Two jobs, so the push token
# never shares a runner with the dispatched branch's code:
#   - `regenerate` runs the branch's install and Playwright (untrusted code) with
#     a read-only token and no PAT, and uploads only the screenshot directory.
#   - `push` runs on a fresh checkout, runs none of the branch's code, copies in
#     only regular `.png` files from the artifact, and is the only job that sees
#     BASELINES_PUSH_TOKEN.
# All git work runs on the host runner (the image has no git, #1711); only the
# Playwright run uses the image, via `docker run` against the shared checkout.
# macOS agents can't produce these (scripts/docker-test-visual.sh only checks),
# so this stops them being deferred (#1577).
#
# Run: Actions > update-linux-baselines > Run workflow, pick the PR branch.
# Pushes with the BASELINES_PUSH_TOKEN secret (a fine-grained PAT or GitHub App
# token with Contents: write), not GITHUB_TOKEN: a GITHUB_TOKEN push does not
# trigger CI, and runs attributed to github-actions[bot] wait for manual approval.
name: update-linux-baselines

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-linux-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'dfadler/zombie-mermaid' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Merged here too so the baselines are rendered from the same tree the
      # `push` job commits onto.
      - name: Merge main first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate Linux baselines
        env:
          IMAGE: ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only@sha256:aa9d5b32ea243e0f6880c5ad7b4fbb1ab863e97d271a215f5bd966aa58a605d5 # keep in sync with ci.yml's visual-regression job
        run: |
          docker run --rm --ipc=host -v "$GITHUB_WORKSPACE:/work" -w /work \
            "$IMAGE" node_modules/.bin/playwright test --update-snapshots

      - name: Upload regenerated screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-baselines
          path: __tests__/visual/__screenshots__
          if-no-files-found: error
          retention-days: 1

  push:
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'dfadler/zombie-mermaid' && github.ref != 'refs/heads/main'
    permissions:
      contents: read # pushes with BASELINES_PUSH_TOKEN below, not the job token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Download regenerated screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-baselines
          path: regenerated-baselines

      # The artifact was produced next to the branch's own code, so treat it as
      # untrusted: refuse anything but plain files and directories (no
      # symlinks), and copy only `.png` into the screenshots directory.
      - name: Commit and push
        env:
          PUSH_TOKEN: ${{ secrets.BASELINES_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$(find regenerated-baselines ! -type f ! -type d -print -quit)" ]; then
            echo "::error::artifact contains something other than regular files and directories"
            exit 1
          fi
          rsync -a --include='*/' --include='*.png' --exclude='*' \
            regenerated-baselines/ __tests__/visual/__screenshots__/
          git add __tests__/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi
          git commit -m "test(visual): regenerate Linux baselines"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
