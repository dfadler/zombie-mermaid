name: Release assets

# Signed release assets and SBOM (#1872). Separate from publish.yml on purpose
# (#2013 edits that file): this runs after "Release" completes, builds the
# umbrella tarball from the released commit, and attaches to the GitHub release
#   - zombie-mermaid-<v>.tgz
#   - zombie-mermaid-<v>.cdx.json         CycloneDX SBOM from `pnpm sbom`
#   - <each of the above>.sigstore.json   Sigstore bundles from actions/attest
#     (what Scorecard's Signed-Releases check looks for on release assets).
#
# Why workflow_run and not `release: published`: changesets/action creates the
# release with GITHUB_TOKEN, and events created by GITHUB_TOKEN do not trigger
# other workflows. Idempotent: skips when the release is missing (Version PR
# run) or already has the SBOM asset. Honest limit: the tarball is repacked
# from the tagged commit, so it is not guaranteed byte-identical to the one on
# npm; npm's own provenance (publishConfig.provenance) covers that artifact.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)attach assets to, e.g. zombie-mermaid@5.3.0'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build tarball and SBOM
    if: >-
      github.repository == 'dfadler/zombie-mermaid' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # read-only token; this job runs install/build scripts
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      run: ${{ steps.meta.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Decide whether assets are needed
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${DISPATCH_TAG:-zombie-mermaid@${version}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if ! assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "No release for ${tag} (Version PR run?); nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif grep -q '\.cdx\.json$' <<<"$assets" && [ -z "$DISPATCH_TAG" ]; then
            echo "${tag} already has an SBOM; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.meta.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.meta.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.meta.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build, pack and generate SBOM
        if: steps.meta.outputs.run == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pnpm run build
          mkdir release-assets
          pnpm pack --pack-destination release-assets
          # Production deps only, from the lockfile (no store reads).
          pnpm sbom --sbom-format cyclonedx --prod --lockfile-only \
            --out "release-assets/zombie-mermaid-${VERSION}.cdx.json"
          ls -l release-assets

      - name: Upload assets
        if: steps.meta.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          retention-days: 1

  sign:
    name: Sign and attach to release
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      id-token: write # Sigstore OIDC
      attestations: write # persist the attestation
      artifact-metadata: write # required by actions/attest
    # No checkout and no install here: the signing identity is only exposed to
    # pinned actions and the gh CLI, never to repo or dependency code.
    steps:
      - name: Download assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Attest tarball (SLSA build provenance)
        id: prov
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/zombie-mermaid-${{ needs.build.outputs.version }}.tgz

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/zombie-mermaid-${{ needs.build.outputs.version }}.tgz
          sbom-path: release-assets/zombie-mermaid-${{ needs.build.outputs.version }}.cdx.json

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PROV_BUNDLE: ${{ steps.prov.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tgz="release-assets/zombie-mermaid-${VERSION}.tgz"
          sbom="release-assets/zombie-mermaid-${VERSION}.cdx.json"
          cp "$PROV_BUNDLE" "${tgz}.sigstore.json"
          cp "$SBOM_BUNDLE" "${sbom}.sigstore.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$tgz" "${tgz}.sigstore.json" "$sbom" "${sbom}.sigstore.json"
