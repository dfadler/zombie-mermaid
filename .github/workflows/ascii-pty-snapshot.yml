name: ASCII real-PTY snapshots (PROPOSAL, non-blocking)

# PROPOSAL for zombie-mermaid#1151 Option B. See
# docs/decisions/ascii-pty-snapshot-suite-1151.md. NOT a required check and
# not part of ci.yml: `continue-on-error` keeps a red result from failing the
# PR, and the path filter keeps it off PRs that cannot change ASCII output.
# Delete this file (plus scripts/ascii-pty-snapshot*, and
# __tests__/ascii-pty-snapshots/) to back the proposal out.
#
# What it runs: scripts/ascii-pty-snapshot.sh, which records 13 curated
# samples through a real PTY (asciinema) and rasterizes them with agg's
# Docker image pinned by digest, then compares the terminal text exactly and
# the PNG with a pixel tolerance against committed goldens.
on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - 'packages/ascii-renderer/**'
      - 'packages/site/ascii-html.ts'
      - 'packages/site/samples-data.ts'
      - 'scripts/ascii-terminal-capture.sh'
      - 'scripts/ascii-render-runner.mjs'
      - 'scripts/ascii-pty-snapshot*'
      - '__tests__/ascii-pty-snapshots/**'
      - '.github/workflows/ascii-pty-snapshot.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty-snapshots:
    name: Real-PTY snapshots (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only: a mismatch shows as a failed step but never fails the run.
    continue-on-error: true
    # Same fork-of-this-fork guard as ci.yml's jobs.
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: read # checkout only; nothing is written back
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # asciinema comes from Ubuntu's archive (2.x on 24.04; the capture
      # script handles both the 2.x and 3.x size flags). Pillow does the
      # crop and diff; pinned so the PNG diff can't shift under us.
      - name: Install asciinema and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends asciinema
          python3 -m pip install --user 'pillow==12.3.0'

      - name: Pre-pull the pinned agg image
        run: |
          image="$(sed -n "s/^DEFAULT_AGG_IMAGE='\(.*\)'$/\1/p" scripts/ascii-pty-snapshot.sh)"
          docker pull "$image"

      # A hosted runner step has no controlling terminal, and asciinema
      # needs one to record. `script` allocates a PTY around the whole run.
      - name: Compare real-PTY captures against goldens
        id: compare
        run: script -qefc "scripts/ascii-pty-snapshot.sh --out-dir pty-snapshot-out" /dev/null

      - name: Upload captures and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ascii-pty-snapshot-out
          path: pty-snapshot-out/
          retention-days: 14
          if-no-files-found: ignore
