name: Accessibility (axe)

# Builds the static site and runs the axe-core scan in
# __tests__/a11y/site.a11y.test.ts (#1765). Separate from ci.yml on purpose:
# it is not one of the required checks (test, Build site generator check,
# Semgrep SAST scan, Changeset present) and changes none of them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axe:
    name: axe-core scan of built site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code, builds and scans
    # Same fork-of-this-fork guard as ci.yml/pages.yml.
    if: github.repository == 'dfadler/zombie-mermaid'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: fork-fixes.ts renders each "before" from a
          # historical commit (same as pages.yml).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site
        run: pnpm run build:site

      - name: Run axe scan
        run: pnpm run test:a11y
