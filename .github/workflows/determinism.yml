name: Render determinism

# Cross-OS / cross-Node byte-identity check for rendered output (#1861).
# Each matrix cell renders every gallery sample (packages/site/samples-data.ts)
# to SVG and ASCII and uploads a hash manifest; `compare` diffs every manifest
# against ubuntu/node-24 and fails on any mismatch.
#
# Advisory: `compare` has continue-on-error, so a mismatch shows as a red job
# plus a step summary without turning the workflow run red. Drop that line to
# make it enforcing once it has run clean for a while.
#
# Out of scope: browser text measurement and the Playwright visual baselines
# (fonts differ per OS and those baselines are already per-OS). This checks the
# pure-JS layout + string output only.
on:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths:
      - 'packages/**'
      - 'src/**'
      - 'scripts/determinism-manifest.ts'
      - 'scripts/lib/determinism-manifest.ts'
      - '.github/workflows/determinism.yml'
      - 'pnpm-lock.yaml'
      # Version Packages PRs only bump versions/changelogs (#2250); output is
      # unchanged. Dependency edits still arrive via pnpm-lock.yaml above.
      - '!packages/*/CHANGELOG.md'
      - '!packages/*/package.json'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: manifest (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm, Node.js and install
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Render hash manifest
        run: >
          node --import tsx
          scripts/determinism-manifest.ts > manifest.txt

      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.os }}-node${{ matrix.node }}
          path: manifest.txt
          if-no-files-found: error

  compare:
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # advisory, see header
    steps:
      - name: Download manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-*

      - name: Diff against ubuntu/node-24
        run: |
          base=manifest-ubuntu-latest-node24/manifest.txt
          status=0
          for f in manifest-*/manifest.txt; do
            [ "$f" = "$base" ] && continue
            if ! diff -u --label "$base" --label "$f" "$base" "$f" > "diff.txt"; then
              status=1
              echo "::error::${f%/manifest.txt} differs from ubuntu-latest/node 24"
              { echo "### ${f%/manifest.txt} vs ubuntu-latest-node24"; echo '```diff'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ "$status" = 0 ] && echo "All manifests identical ($(wc -l < "$base") renders each)." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
