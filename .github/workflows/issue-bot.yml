name: issue-bot

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  issue-bot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: dfadler/issue-bot@1ab206ba2134b5bf0419ec69a69cb3a9d050cc27 # main, fixes invalid node22 runtime
