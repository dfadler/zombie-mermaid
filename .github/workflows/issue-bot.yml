name: issue-bot

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  issue-bot:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: dfadler/issue-bot@218b3478e4a6fa992ea813cabcdf0a60f7e27f10 # main, fixes thread dedup + node24
