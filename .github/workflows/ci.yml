name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default (#1732): every job below also declares its own block,
# so this only guards a future job that forgets to.
permissions:
  contents: read

# Cancel superseded runs on a PR branch (repeated pushes) instead of letting
# them pile up. Pushes to main are keyed by SHA and never cancelled: a
# cancelled run is the latest completed run on main, and the README's
# native CI badge renders that as "failing". CI runs have no side effects
# worth protecting mid-flight, so cancelling PR runs is safe (see
# publish.yml's concurrency block for why it deliberately isn't).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path scoping for the heavy, NON-required jobs (#1586). Deliberately a job
  # rather than a workflow-level `paths:`/`paths-ignore:` filter: a filter that
  # suppresses the whole workflow leaves required checks never reporting and
  # blocks the PR forever. Here every required check (`test`, `Build site
  # generator check`, `Semgrep SAST scan`, `Changeset present`) is unconditional
  # and does NOT depend on this job; only visual-regression and
  # packed-smoke (`code`) and bench (`bench`) are gated, and a job skipped via
  # `if:` reports as skipped, never as missing. Fails open: pushes to main, an
  # empty/failed diff, or any file outside the docs-only lists below set both
  # outputs to true, so a path nobody anticipated runs everything.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # only checks out code and diffs against origin/main
    if: github.repository == 'dfadler/zombie-mermaid'
    outputs:
      code: ${{ steps.scope.outputs.code }}
      bench: ${{ steps.scope.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          emit() { echo "code=$1" >> "$GITHUB_OUTPUT"; echo "bench=$2" >> "$GITHUB_OUTPUT"; echo "code=$1 bench=$2"; }
          if [ "$EVENT_NAME" != pull_request ]; then
            emit true true; exit 0
          fi
          if ! changed="$(git diff --name-only origin/main...HEAD)" || [ -z "$changed" ]; then
            emit true true; exit 0
          fi
          # code=false only if EVERY file is docs/changeset/maintainer-prose
          # (README.md is excluded: it ships in the tarball). bench=false
          # also for files no benchmark reads (tests, demo, bot data, blog).
          # Anything else, including .github/ and scripts/, keeps both true.
          # awk, not grep -c: always exits 0 (see the changeset job).
          docs='^(docs/|\.changeset/|(CHANGELOG|CONTRIBUTING|SECURITY|CLAUDE)\.md$)'
          nobench='^(docs/|\.changeset/|(CHANGELOG|CONTRIBUTING|SECURITY|CLAUDE|README)\.md$|__tests__/|demo/|badges/|blog-posts/|bench-history\.jsonl$)'
          n_code="$(printf '%s\n' "$changed" | re="$docs" awk 'NF && $0 !~ ENVIRON["re"] { c++ } END { print c + 0 }')"
          n_bench="$(printf '%s\n' "$changed" | re="$nobench" awk 'NF && $0 !~ ENVIRON["re"] { c++ } END { print c + 0 }')"
          emit "$([ "$n_code" -gt 0 ] && echo true || echo false)" "$([ "$n_bench" -gt 0 ] && echo true || echo false)"

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code and runs tests/lint; no writes back to the repo
    # Guards against this workflow's jobs running (and burning Actions
    # minutes) with unintended side effects in a downstream fork — e.g. if
    # someone forks dfadler/zombie-mermaid a second time, GitHub copies this
    # workflow file into their fork, and push/PR events there DO trigger it
    # (once the fork owner does the one-time manual "enable Actions" step),
    # using their own Actions budget. `github.repository` there evaluates to
    # *their* repo (e.g. `their-name/zombie-mermaid`), so this condition is
    # false and the job is skipped.
    #
    # This is NOT what protects PRs opened *against* this repo from
    # untrusted forks, and it does not skip CI for them. For pull_request-
    # triggered runs, `github.repository` always resolves to the base repo
    # (dfadler/zombie-mermaid) regardless of which fork the PR's head branch
    # lives on — GitHub's docs describe `pull_request` as running "in the
    # context of the merge commit" (of the base repo), the same base-repo
    # framing used to contrast it with `pull_request_target`, which runs "in
    # the context of the default branch of the base repository." So this
    # guard is always true for PRs into this repo, fork or not, and CI still
    # runs for them — which is what we want.
    #
    # The actual protection against untrusted fork PRs (leaking secrets to
    # attacker-controlled code) already comes for free from using plain
    # `pull_request:` here rather than `pull_request_target:`: per GitHub's
    # docs, for pull_request runs triggered from a forked repository,
    # "secrets are not passed to the runner" (aside from GITHUB_TOKEN) and
    # "the GITHUB_TOKEN has read-only permissions." That protection is
    # independent of this if: guard — this guard is solving a different,
    # real problem (downstream-fork budget/behavior), not a redundant one.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so check-diff-coverage.ts can diff against
          # origin/main below (a shallow checkout wouldn't have it).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Feeds the live coverage badge in README.md. Needs CODECOV_TOKEN
      # (from codecov.io, once the repo is linked there) as a repo secret —
      # without it this step fails rather than silently skipping, so the
      # badge's data source stays honest about whether it's actually wired up.
      # The junit report written by config/vitest.config.ts under CI (#1838).
      # The job summary (Vitest's github-actions reporter) lists any test that
      # passed only on retry; see CONTRIBUTING.md "Flaky tests".
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-report
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      # Repo-wide thresholds above (enforced by config/vitest.config.ts) cover the
      # whole codebase, including old, hard-to-reach branches. This holds
      # new/changed lines to a stricter 90% bar without requiring an
      # all-at-once cleanup of existing gaps.
      - name: Check coverage on new/changed code
        run: pnpm run coverage:diff

      # Docs drift guards (#1570): dead links/anchors, stale repo paths,
      # diagram-type counts, Node-version consistency.
      - name: Check docs drift
        run: pnpm run check:docs

      # Guards against a new whole-tree snapshot or raw markup string-pin
      # creeping into demo/editor component tests one unreviewed file at a
      # time, now that RTL is the expected pattern for them (#817, part of
      # the #815 RTL migration epic) — see docs/testing-conventions.md and
      # scripts/check-snapshot-allowlist.sh --help.
      - name: Check snapshot test allow-list
        run: scripts/check-snapshot-allowlist.sh

  # Lint/typecheck/format run in parallel with the tests (#1786) instead of
  # serially after them; the `test` job below fans these back into the one
  # required check name.
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Same fork guard as `unit-tests`.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        # Runs both the library config and demo/tsconfig.json — the demo's
        # client-side code needs DOM types the root config deliberately omits,
        # so it is checked under its own config rather than weakening the
        # root's guarantees for library source.
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

  # The REQUIRED status check in branch protection is named `test`; this job
  # keeps that exact name (do not add a `name:` or rename the key) so the
  # split needs no branch-protection edit (#1786). `if: always()` makes it run
  # even when a dependency failed, was cancelled or was skipped (a plain job
  # would be skipped, and a skipped required check counts as passing). It then
  # passes only if every dependency is exactly `success`. Both dependencies
  # are unconditional apart from the fork guard, which is also on this job, so
  # `skipped` is never a legitimate outcome here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, static]
    if: always() && github.repository == 'dfadler/zombie-mermaid'
    permissions: {}
    steps:
      - name: Require every needed job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -uo pipefail
          echo "needed job results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "no needed results"; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a needed job ended as '$r'"; exit 1; }
          done

  build-site:
    name: Build site generator check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs the generator scripts; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: fork-fixes.ts renders each "before" by extracting
          # the source tree at a historical commit, which a shallow checkout
          # does not contain.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the same generator scripts (index.ts/editor.ts via esbuild) that
      # pages.yml deploys to GitHub Pages, without the actual deploy step —
      # this only proves the site builds, it never publishes anything and
      # needs no deploy credentials. Output isn't committed or uploaded.
      - name: Build site (generator check only, not deployed)
        run: pnpm run build:site

  visual-regression:
    name: Visual regression (SVG + ASCII screenshots)
    runs-on: ubuntu-latest
    # 15 rather than the 10 this job used on a bare runner: the job clock
    # now also covers GitHub's "Initialize containers" phase (a ~2.3GB image
    # pull on a cold runner). That is offset by dropping the browser
    # download/extract below, so the steady-state runtime should be similar
    # — the extra 5 minutes is headroom for the pull, not for the suite.
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code and runs the visual suite; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    needs: changes
    if: github.repository == 'dfadler/zombie-mermaid' && needs.changes.outputs.code == 'true'
    # Runs the suite inside a custom, chromium-only Playwright image instead
    # of provisioning Chromium onto a bare runner. Per
    # docs/decisions/playwright-docker-image-visual-regression.md's
    # 2026-09-07 amendment, running the suite in a container at all *is* the
    # remaining experiment for zombie-mermaid#544: its acceptance bar is a
    # green run against the UNCHANGED committed baselines. If it goes red,
    # revert this job to the bare-runner provisioning it replaced and
    # re-open that decision — do not regenerate baselines to close the gap,
    # since the committed baselines are the measuring instrument for every
    # result the #544 cluster produced. Pre-flight evidence (3x full-suite
    # green, 281/281, zero retries consumed, inside a Playwright container
    # image on an emulated-amd64 host) is in
    # https://github.com/dfadler/zombie-mermaid/issues/549#issuecomment-6130805981.
    #
    # zombie-mermaid#868 (a #737 follow-up) switched this job from the
    # stock, multi-browser `mcr.microsoft.com/playwright:v1.62.1-jammy` image
    # to `docker/visual-regression-chromium.Dockerfile`'s chromium-only
    # build, published to GHCR by
    # .github/workflows/visual-regression-chromium-image.yml: #737 measured
    # the chromium-only image pulling ~36% faster (~43s saved per 4-shard
    # run) since it doesn't ship the Firefox/WebKit binaries
    # playwright.config.ts's single `chromium` project never exercises (see
    # that config's `projects:` array). #868 re-ran the suite against this
    # exact image/digest before adopting it: 281/281 passed against the
    # UNCHANGED committed baselines, same as the pre-flight evidence above
    # (run https://github.com/dfadler/zombie-mermaid/actions/runs/34413642128,
    # shard results: 71+70+70+70 passed). The GHCR package is public, so no
    # `packages: read` permission or pull credentials are needed here
    # (verified with an unauthenticated `docker manifest inspect`).
    #
    # The image's Chromium build/version MUST stay in lockstep with
    # package.json's @playwright/test (1.62.1) and with
    # docker/visual-regression.Dockerfile's base tag — see both Dockerfiles'
    # own header comments, which cross-reference each other so a future
    # base-tag bump doesn't silently drift the two apart. jammy, not noble —
    # zombie-mermaid#326 measured a baseline mismatch on the -noble variant,
    # and docker/visual-regression-chromium.Dockerfile matches jammy for the
    # same reason.
    #
    # --ipc=host follows Playwright's own Docker guidance ("recommended
    # when using Chromium... without it, Chromium can run out of memory and
    # crash" — https://playwright.dev/docs/docker). Playwright's GitHub
    # Actions example also passes `--user 1001`; that is omitted here
    # because this image runs as root by default (no `USER` instruction —
    # see docker/visual-regression-chromium.Dockerfile).
    container:
      # Pinned by digest (the amd64 manifest, matching ubuntu-latest's
      # architecture — docker/build-push-action's default attestation
      # manifest is `unknown/unknown` and must be skipped) rather than the
      # mutable `:latest`/`:<sha>` tags, so Chromium and its system
      # libraries can't drift without a workflow change - the same
      # reasoning the actions/checkout SHA pin below follows. Re-derive with
      # `docker manifest inspect
      # ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only:latest`
      # (picking the `platform.architecture == "amd64"` entry) after
      # dispatching .github/workflows/visual-regression-chromium-image.yml
      # to publish a new build.
      image: ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only@sha256:aa9d5b32ea243e0f6880c5ad7b4fbb1ab863e97d271a215f5bd966aa58a605d5 # built from docker/visual-regression-chromium.Dockerfile at commit bb5b296 (v1.62.1-jammy, chromium-only, Node 24)
      options: --ipc=host
    # Splits the ~280 screenshot tests across 4 parallel runners via
    # Playwright's own --shard flag. Each shard still runs at
    # playwright.config.ts's workers: 2 — that cap exists to avoid
    # CPU-contention noise in the pixel diffs (see the comment there), and
    # sharding across separate runners doesn't reintroduce it since each
    # shard has its own CPU, unlike raising workers on one runner would.
    # fail-fast: false so one flaky/failing shard doesn't cancel the others
    # mid-run and hide their results.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      # This job uploads a writable artifact (screenshots) on failure from
      # a pull_request run, which can execute PR-controlled code (the repo's
      # own test suite). actions/checkout's default persist-credentials:true
      # would leave the read-only GITHUB_TOKEN in the local git config for
      # that code to read; nothing after checkout needs authenticated git,
      # so it's disabled.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlike the old stock mcr.microsoft.com/playwright image, this
      # chromium-only image already bakes in `fonts-dejavu-core` and
      # verifies the fc-match resolution at *build* time (see
      # docker/visual-regression-chromium.Dockerfile) — a bare image ships
      # 50 fonts and none of the DejaVu family, so fontconfig would
      # otherwise resolve the generic CSS `monospace` family to WenQuanYi
      # Zen Hei Mono, a CJK face that draws box-drawing glyphs (U+2500 etc.)
      # at full width while drawing Latin at half width. The ASCII panel is
      # a character grid built entirely out of those glyphs, so that
      # mis-resolution would inflate the grid and mismatch the committed
      # baselines (measured three times against the old image:
      # docs/research/614-docker-font-parity.md). There is therefore no
      # runtime `apt-get install` step here anymore — this step only
      # re-checks, at run time, that the image's build-time fix actually
      # took effect in this container, the same way
      # docker/visual-regression-chromium.Dockerfile's own build-time
      # assertion guards the image build itself. A base-tag bump that
      # silently changed font resolution would otherwise surface only as
      # ~90 mismatched screenshots, which reads like a rendering regression
      # in the renderer rather than a problem with the image — and the
      # tempting "fix" for that is regenerating baselines, which is exactly
      # what must not happen here.
      - name: Verify generic font families resolve to DejaVu
        run: |
          # Exact family match, not a `DejaVu*` glob: fonts-dejavu-core installs
          # DejaVu Sans (proportional), DejaVu Serif, and DejaVu Sans Mono
          # together, so a glob would also accept the proportional "DejaVu Sans"
          # face for the `monospace` generic - silently defeating this guard's
          # purpose (a monospace grid rendered in a proportional font) if
          # `monospace` ever misresolved to it.
          assert_family() {
            generic="$1"
            expected="$2"
            match="$(fc-match -f '%{family}' "$generic")"
            if [ "$match" != "$expected" ]; then
              echo "::error::fc-match $generic resolved to '$match', expected '$expected' — the image's baked-in fonts-dejavu-core install did not take effect. Do NOT regenerate baselines to make this job green."
              exit 1
            fi
          }
          assert_family monospace "DejaVu Sans Mono"
          assert_family sans-serif "DejaVu Sans"
          assert_family serif "DejaVu Serif"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Pinned to 22 even though the image ships a newer Node: SVG and ASCII
      # output are generated in Node (only DOM mounting happens in the
      # browser — see playwright.config.ts and __tests__/visual/helpers/),
      # so the Node version is part of what produced the baselines, and the
      # rest of this workflow's jobs are on 22.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install` and no actions/cache step: the container
      # already carries the Chrome-for-Testing build matching the pinned
      # @playwright/test version, at the $PLAYWRIGHT_BROWSERS_PATH the
      # image sets (/ms-playwright), and its system dependencies are baked
      # in. That is the same thing Playwright's own GitHub Actions container
      # example relies on (https://playwright.dev/docs/ci). It is also the
      # full Chrome-for-Testing binary rather than headless-shell — which
      # renders subtly differently in places — so this stays comparable to
      # the committed -linux.png baselines, the same property the old
      # `--only-shell`-avoiding install step was protecting.
      #
      # This suite runs under Playwright Test, not Vitest's browser mode —
      # see zombie-mermaid#299 for why: Vitest's Node<->browser RPC bridge
      # has an unfixed, still-open upstream bug (vitest-dev/vitest#10791)
      # that hung this exact job's CI runs (reproduced even on the
      # vitest@5.0.0-rc line meant to fix it). Playwright Test drives the
      # browser entirely from Node, so there's no such bridge to hang on.
      #
      # For ASCII samples this job only screenshots ascii-html.ts's browser/
      # HTML approximation of a terminal, never a real PTY — a passing run
      # here is not proof ASCII output is correct in an actual terminal (see
      # zombie-mermaid#348 and CONTRIBUTING.md's "Visual regression tests").
      #
      # --shard runs only this shard's slice of the suite; `pnpm run
      # test:visual` isn't used directly here since it doesn't forward
      # extra playwright args.
      - name: Run visual regression suite
        id: visual-tests
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # One artifact per shard — upload-artifact v4 requires unique names
      # within a run, and each shard produces its own disjoint slice of
      # test-results/playwright-report anyway, so there's nothing to merge.
      - name: Upload failure report
        id: upload-report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-failures-${{ matrix.shardIndex }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Surfaces the failure directly on the check's Summary tab — one click
      # from the PR, no digging through the raw job log — with a direct link
      # to download the full interactive Playwright report (side-by-side
      # diffs + traces). This can't embed the interactive report itself:
      # actions/upload-artifact's browser-preview mode only renders a single
      # simple file with no external CSS/JS, and the Playwright HTML report
      # is a full app (its own JS bundle, trace/diff viewer data) — see #306
      # for the fuller evaluation of GitHub Pages / third-party hosting
      # options that could close that remaining gap.
      - name: Write visual regression summary
        if: failure() && steps.visual-tests.conclusion == 'failure'
        # The job's container (Playwright jammy image) has bash, but the
        # container default is `sh -e` (dash); the here-string below is
        # bash-only (#1992).
        shell: bash
        run: |
          {
            echo "## Visual regression failures (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
            echo
            if [ -n "${{ steps.upload-report.outputs.artifact-url }}" ]; then
              echo "[Download the full interactive Playwright report](${{ steps.upload-report.outputs.artifact-url }}) (the \`visual-regression-failures-${{ matrix.shardIndex }}\` artifact) — extract it and run \`pnpm exec playwright show-report playwright-report\` for the side-by-side diff/trace viewer."
              echo
            fi
            echo "Failed screenshots:"
            echo
            diffs=$(find test-results -iname '*-diff.png' 2>/dev/null | sort || true)
            if [ -z "$diffs" ]; then
              echo "- (no per-screenshot diff files found — see the full report or job log for details)"
            else
              while IFS= read -r f; do
                echo "- \`${f#test-results/}\`"
              done <<< "$diffs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The `visual-regression-comment` / `visual-regression-resolved` jobs that
  # used to live here (added by #1138) were removed in favor of
  # .github/workflows/visual-regression-post-comment.yml — a separate
  # `workflow_run`-triggered workflow that reacts to THIS workflow's
  # completion instead of running inline as a `pull_request` job. That
  # move is what makes posting work on fork-authored PRs (#1139): a
  # `pull_request` job here only ever gets a read-only token and no repo
  # secrets on a fork PR, which is exactly the gap #1138's review thread
  # (https://github.com/dfadler/zombie-mermaid/pull/1138#discussion_r4111697437)
  # flagged and #1139 exists to close. The new workflow file's own header
  # comment documents the full trust-boundary validation it performs
  # (confirming the originating run/PR/job before posting) and the #1140
  # dedicated-PAT swap for the `--attach` image path.

  bench:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs the benchmark; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    needs: changes
    if: github.repository == 'dfadler/zombie-mermaid' && needs.changes.outputs.bench == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: pnpm run bench -- --json=bench-current.json

      # Gates against bench-baseline.json with a deliberately loose threshold
      # (see scripts/bench-compare.ts) — shared runners are noisy enough that
      # a tight threshold would flag CI variance rather than a real
      # regression. The goal is catching an accidental algorithmic blowup,
      # not micro-tuning render time.
      - name: Compare against baseline
        run: pnpm run bench:compare -- bench-current.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-result
          path: bench-current.json
          retention-days: 30

      # Per-package benchmarks (#875, split from #869): bench.ts above only
      # measures full end-to-end render time, so a regression anywhere in
      # the pipeline shows up as just "render got slower" with no way to
      # tell which package caused it. Each of these times only one
      # package's own code — see each script's header comment for exactly
      # what is (and isn't) included in its timed region.
      - name: Run core benchmark
        run: pnpm run bench:core -- --json=bench-core-current.json

      - name: Run mermaid-parser benchmark
        run: pnpm run bench:mermaid-parser -- --json=bench-mermaid-parser-current.json

      - name: Run svg-renderer benchmark
        run: pnpm run bench:svg-renderer -- --json=bench-svg-renderer-current.json

      - name: Run ascii-renderer benchmark
        run: pnpm run bench:ascii-renderer -- --json=bench-ascii-renderer-current.json

      # Same deliberately loose threshold philosophy as "Compare against
      # baseline" above (see scripts/bench-package-compare.ts) — but no
      # per-package baseline is committed yet, so each comparison no-ops
      # (exit 0) until a maintainer seeds one from a real CI run, the same
      # bootstrap this repo already used for bench-history.jsonl (#874).
      - name: Compare per-package benchmarks against baselines
        run: |
          pnpm run bench:package-compare -- bench-core-current.json --baseline=bench-baseline-core.json
          pnpm run bench:package-compare -- bench-mermaid-parser-current.json --baseline=bench-baseline-mermaid-parser.json
          pnpm run bench:package-compare -- bench-svg-renderer-current.json --baseline=bench-baseline-svg-renderer.json
          pnpm run bench:package-compare -- bench-ascii-renderer-current.json --baseline=bench-baseline-ascii-renderer.json

      - name: Upload per-package benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-package-results
          path: |
            bench-core-current.json
            bench-mermaid-parser-current.json
            bench-svg-renderer-current.json
            bench-ascii-renderer-current.json
          retention-days: 30

      # Trend-history recording (bench-history.jsonl) used to run from here
      # on every push to main, which meant every merged PR — not just this
      # one's own data — spawned a "record benchmark trend entry" PR. With
      # this repo merging many PRs per day, that produced far more trend
      # PRs than any maintainer could keep up with (24 open, none ever
      # merged, is what prompted this). Trend recording now runs on its own
      # weekly schedule instead — see .github/workflows/dashboard-refresh.yml —
      # fully decoupled from how often main actually gets pushed to.

  packed-smoke:
    name: Packed tarball smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code, builds, packs and installs into temp dirs
    # Same fork-of-this-fork guard as the `test` job above.
    needs: changes
    if: github.repository == 'dfadler/zombie-mermaid' && needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # Installs the packed tarballs into clean projects and checks imports,
      # types, CLI, MCP, rendering, elkjs and a Vite bundle (#1566).
      - name: Smoke-test packed tarballs
        env:
          SMOKE_TARBALL_DIR: ${{ runner.temp }}/tarballs
        run: pnpm run smoke:packed

      # Report-only (#1868): publint + attw (pinned devDependencies, run via
      # pnpm exec) over the tarballs packed above, so nothing is packed twice.
      # continue-on-error keeps it advisory; gate it once the output is clean.
      - name: Lint package exports (publint, attw; report-only)
        continue-on-error: true
        env:
          TARBALL_DIR: ${{ runner.temp }}/tarballs
        run: |
          {
            echo '## publint + arethetypeswrong (report-only)'
            echo '```'
            scripts/check-package-types.sh "$TARBALL_DIR" 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Report-only (#1870): regenerates etc/api/*.api.md from the build above
      # (folded in here from a separate job so the build runs once, #1839) and
      # shows any drift in the job summary. continue-on-error keeps it from
      # ever failing the PR; drop it to gate on public-API changes.
      - name: Regenerate API reports (report-only)
        continue-on-error: true
        run: pnpm run api:report

      - name: Diff API reports against committed (report-only)
        continue-on-error: true
        run: |
          if git diff --exit-code --quiet -- etc/api; then
            echo "Public API surface unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Public API surface changed'
              echo "Run pnpm run build && pnpm run api:report, then commit etc/api/."
              echo "\`\`\`diff"
              git diff -- etc/api
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Public API surface changed (report-only)"
            exit 1
          fi

      # Gates published dist/ output against bundle-size-budget.json — see
      # scripts/check-bundle-size.ts for why this is an in-house gzip check
      # rather than a size-limit/bundlewatch dependency, and how to raise a
      # budget after an intentional, reviewed size increase. Folded in here
      # from the separate `Bundle size gate` job (not a required check) so the
      # build runs once (#1839). It stays a blocking step; `!cancelled()` makes
      # it run even if the smoke test failed, so neither signal hides the other.
      # Nothing above modifies dist/ (pack and the report steps only read it).
      - name: Check bundle size
        if: ${{ !cancelled() }}
        run: pnpm run check:bundle-size

  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs a local scan; no SARIF upload, no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    container:
      # Official Semgrep image; runs entirely against Semgrep's free, public
      # rulesets (no SEMGREP_APP_TOKEN / Semgrep Cloud account required or used).
      # Pinned to 1.179.0 by digest (the `latest` tag as of 2026-10-10) so an
      # engine release can't fail old PRs; bump deliberately. Rules from
      # `--config auto` are still served by the registry and can't be pinned
      # without vendoring them (see #1599).
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `--config auto` pulls Semgrep's community rulesets keyed off the
      # languages detected in this repo (no account/token needed — verified
      # locally while logged out of Semgrep). `--error` makes the step fail
      # the build when findings are reported, rather than just logging them.
      #
      # Aikido is intentionally not run here: full Aikido SCA/secrets CI
      # scanning needs an Aikido account + API token, which the maintainer
      # doesn't have yet. See CONTRIBUTING.md for the local-only Aikido
      # Safe Chain setup that *is* wired in for this repo (install-time
      # malware/supply-chain protection, not something CI can gate on).
      - name: Run Semgrep
        run: semgrep scan --config auto --error

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs `pnpm changeset status` and `check:changesets`; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against. (The additional event_name check
    # here is unrelated to that guard — it just skips this check on push
    # events, since a changeset is only relevant for a PR that hasn't
    # merged yet.) The final clause exempts the changesets/action Version
    # PR: it always modifies package.json/CHANGELOG.md while consuming (and
    # thus never adding) a changeset, so this check would otherwise fail on
    # every release. It's scoped to same-repo PRs (not just the branch name)
    # so a fork can't spoof the branch name to skip its own changeset check.
    if: >-
      github.repository == 'dfadler/zombie-mermaid' && github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Also exempt: badges/ and bench-history.jsonl, the bot-written data
      # files (publish.yml, dashboard-refresh.yml) that used to carry an empty
      # changeset each (#1585).
      # demo/ is never published (it's excluded from package.json's "files"
      # field), so a PR that only touches demo/ has no effect on the shipped
      # package and shouldn't be forced into a version bump + changelog
      # entry. Scoped to "every changed file is under demo/" rather than a
      # flat path-ignore so a PR that touches demo/ *and* src/ still requires
      # a changeset for the src/ change.
      - name: Check whether this PR only touches unpublished/data paths
        id: diff_scope
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only origin/main...HEAD)"
          # awk, not `grep -c`, because grep -c exits 1 (a hard failure
          # under set -e) when the count is zero — exactly the demo-only
          # case this check needs to detect. awk always exits 0.
          non_demo_count="$(printf '%s\n' "$changed_files" | awk 'NF && $0 !~ /^(demo\/|badges\/|bench-history\.jsonl$)/ { count++ } END { print count + 0 }')"
          if [ -z "$changed_files" ] || [ "$non_demo_count" -gt 0 ]; then
            echo "demo_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "demo_only=true" >> "$GITHUB_OUTPUT"
          fi

      # Node/pnpm setup and install run only when the changeset steps will (they
      # are the only ones that need them), so demo/data-only PRs skip ~24 s of
      # setup (#1600). The job itself still always runs and reports.
      - name: Setup pnpm
        if: steps.diff_scope.outputs.demo_only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.diff_scope.outputs.demo_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.diff_scope.outputs.demo_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        if: steps.diff_scope.outputs.demo_only != 'true'
        run: pnpm changeset status --since origin/main

      - name: Lint changeset summaries
        if: steps.diff_scope.outputs.demo_only != 'true'
        run: pnpm run check:changesets

  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # only checks out code and greps commit subjects and the PR body
    if: >-
      github.repository == 'dfadler/zombie-mermaid' && github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The PR body goes through env, never interpolated into the script.
      - name: No TEMP commits; follow-ups must link an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if git log --format=%s origin/main..HEAD | grep -E '^TEMP:'; then
            echo "::error::Commit subject starts with 'TEMP:'; drop or reword it before merging."
            exit 1
          fi
          # A line mentioning a follow-up / "TODO later" needs a #N link on the same line.
          # Markdown table rows are skipped: they carry case/test names (e.g. the
          # run-evals results table's `unfiled-followup`), not promises of later work.
          if printf '%s\n' "$PR_BODY" | grep -iE 'follow-?[ -]?ups?|todo later' | grep -vE '^[[:space:]]*\|' | grep -vE '#[0-9]+'; then
            echo "::error::PR body mentions a follow-up without a #N issue link; file the issue and link it."
            exit 1
          fi
