name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. repeated pushes to a PR
# branch) instead of letting them pile up. Unlike publish.yml, CI runs have
# no side effects worth protecting mid-flight, so cancel-in-progress is safe
# here (see publish.yml's concurrency block for why it deliberately isn't).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code and runs tests/lint; no writes back to the repo
    # Guards against this workflow's jobs running (and burning Actions
    # minutes) with unintended side effects in a downstream fork — e.g. if
    # someone forks dfadler/zombie-mermaid a second time, GitHub copies this
    # workflow file into their fork, and push/PR events there DO trigger it
    # (once the fork owner does the one-time manual "enable Actions" step),
    # using their own Actions budget. `github.repository` there evaluates to
    # *their* repo (e.g. `their-name/zombie-mermaid`), so this condition is
    # false and the job is skipped.
    #
    # This is NOT what protects PRs opened *against* this repo from
    # untrusted forks, and it does not skip CI for them. For pull_request-
    # triggered runs, `github.repository` always resolves to the base repo
    # (dfadler/zombie-mermaid) regardless of which fork the PR's head branch
    # lives on — GitHub's docs describe `pull_request` as running "in the
    # context of the merge commit" (of the base repo), the same base-repo
    # framing used to contrast it with `pull_request_target`, which runs "in
    # the context of the default branch of the base repository." So this
    # guard is always true for PRs into this repo, fork or not, and CI still
    # runs for them — which is what we want.
    #
    # The actual protection against untrusted fork PRs (leaking secrets to
    # attacker-controlled code) already comes for free from using plain
    # `pull_request:` here rather than `pull_request_target:`: per GitHub's
    # docs, for pull_request runs triggered from a forked repository,
    # "secrets are not passed to the runner" (aside from GITHUB_TOKEN) and
    # "the GITHUB_TOKEN has read-only permissions." That protection is
    # independent of this if: guard — this guard is solving a different,
    # real problem (downstream-fork budget/behavior), not a redundant one.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so check-diff-coverage.ts can diff against
          # origin/main below (a shallow checkout wouldn't have it).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      # Feeds the live coverage badge in README.md. Needs CODECOV_TOKEN
      # (from codecov.io, once the repo is linked there) as a repo secret —
      # without it this step fails rather than silently skipping, so the
      # badge's data source stays honest about whether it's actually wired up.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      # Repo-wide thresholds above (enforced by vitest.config.ts) cover the
      # whole codebase, including old, hard-to-reach branches. This holds
      # new/changed lines to a stricter 90% bar without requiring an
      # all-at-once cleanup of existing gaps.
      - name: Check coverage on new/changed code
        run: pnpm run coverage:diff

      - name: Lint
        run: pnpm run lint

      # Guards against a new whole-tree snapshot or raw markup string-pin
      # creeping into demo/editor component tests one unreviewed file at a
      # time, now that RTL is the expected pattern for them (#817, part of
      # the #815 RTL migration epic) — see docs/testing-conventions.md and
      # scripts/check-snapshot-allowlist.sh --help.
      - name: Check snapshot test allow-list
        run: scripts/check-snapshot-allowlist.sh

      - name: Type check
        # Runs both the library config and demo/tsconfig.json — the demo's
        # client-side code needs DOM types the root config deliberately omits,
        # so it is checked under its own config rather than weakening the
        # root's guarantees for library source.
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

  build-site:
    name: Build site generator check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs the generator scripts; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: fork-fixes.ts renders each "before" by extracting
          # the source tree at a historical commit, which a shallow checkout
          # does not contain.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the same generator scripts (index.ts/editor.ts via esbuild) that
      # pages.yml deploys to GitHub Pages, without the actual deploy step —
      # this only proves the site builds, it never publishes anything and
      # needs no deploy credentials. Output isn't committed or uploaded.
      - name: Build site (generator check only, not deployed)
        run: pnpm run build:site

  visual-regression:
    name: Visual regression (SVG + ASCII screenshots)
    runs-on: ubuntu-latest
    # 15 rather than the 10 this job used on a bare runner: the job clock
    # now also covers GitHub's "Initialize containers" phase (a ~2.3GB image
    # pull on a cold runner). That is offset by dropping the browser
    # download/extract below, so the steady-state runtime should be similar
    # — the extra 5 minutes is headroom for the pull, not for the suite.
    timeout-minutes: 15
    permissions:
      contents: read # only checks out code and runs the visual suite; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'
    # Runs the suite inside the pinned upstream Playwright image instead of
    # provisioning Chromium onto a bare runner. Per
    # docs/decisions/playwright-docker-image-visual-regression.md's
    # 2026-09-07 amendment, this job *is* the remaining experiment for
    # zombie-mermaid#544: its acceptance bar is a green run against the
    # UNCHANGED committed baselines. If it goes red, revert this job to the
    # bare-runner provisioning it replaced and re-open that decision — do
    # not regenerate baselines to close the gap, since the committed
    # baselines are the measuring instrument for every result the #544
    # cluster produced. Pre-flight evidence (3x full-suite green, 281/281,
    # zero retries consumed, inside this exact image on an emulated-amd64
    # host) is in docs/research/549-ci-container-migration.md.
    #
    # The tag MUST stay in lockstep with package.json's @playwright/test
    # (1.62.1): the image ships the matching Chrome-for-Testing build at
    # $PLAYWRIGHT_BROWSERS_PATH (/ms-playwright), which is exactly what
    # lets the actions/cache + `playwright install` steps disappear below.
    # jammy, not noble — zombie-mermaid#326 measured a baseline mismatch on
    # the -noble variant.
    #
    # This is deliberately the *stock* tag plus the apt step below, not a
    # custom image built from docker/visual-regression.Dockerfile and
    # pushed to GHCR: Actions' `container:` key takes an image reference,
    # not a Dockerfile, so consuming that file here would mean publishing
    # an image and keeping a second version pin in sync — for one apt
    # package. The Dockerfile stays as the local-dev artifact (#550) and as
    # the written-down reasoning for *why* the package is fonts-dejavu-core.
    #
    # --ipc=host follows Playwright's own Docker guidance ("recommended
    # when using Chromium... without it, Chromium can run out of memory and
    # crash" — https://playwright.dev/docs/docker). Playwright's GitHub
    # Actions example also passes `--user 1001`; that is omitted here
    # because the font step below needs root.
    container:
      # Pinned by digest (the amd64 manifest for v1.62.1-jammy, matching
      # ubuntu-latest's architecture) rather than the mutable tag, so
      # Chromium and its system libraries can't drift without a workflow
      # change - the same reasoning the actions/checkout SHA pin below
      # follows. Re-derive with `docker manifest inspect
      # mcr.microsoft.com/playwright:v1.62.1-jammy` when bumping the tag.
      image: mcr.microsoft.com/playwright@sha256:75d2d72c89da49d06aa7f6e623987392019aebbc52c09fd8cd6e2c94c7c7d71d # v1.62.1-jammy (amd64)
      options: --ipc=host
    # Splits the ~280 screenshot tests across 4 parallel runners via
    # Playwright's own --shard flag. Each shard still runs at
    # playwright.config.ts's workers: 2 — that cap exists to avoid
    # CPU-contention noise in the pixel diffs (see the comment there), and
    # sharding across separate runners doesn't reintroduce it since each
    # shard has its own CPU, unlike raising workers on one runner would.
    # fail-fast: false so one flaky/failing shard doesn't cancel the others
    # mid-run and hide their results.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      # This job uploads a writable artifact (screenshots) on failure from
      # a pull_request run, which can execute PR-controlled code (the repo's
      # own test suite). actions/checkout's default persist-credentials:true
      # would leave the read-only GITHUB_TOKEN in the local git config for
      # that code to read; nothing after checkout needs authenticated git,
      # so it's disabled.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The stock image ships 50 fonts and none of the DejaVu family, so
      # fontconfig resolves the generic CSS `monospace` family to WenQuanYi
      # Zen Hei Mono — a CJK face that draws box-drawing glyphs (U+2500
      # etc.) at full width while drawing Latin at half width. The ASCII
      # panel is a character grid built entirely out of those glyphs, so
      # without this step the grid inflates and 88 of 90 ascii-samples
      # screenshots mismatch the committed baselines (measured three times:
      # docs/research/614-docker-font-parity.md). `fonts-dejavu-core` is
      # what a bare `ubuntu-latest` runner already resolves `monospace` to,
      # and therefore what produced the committed -chromium-linux.png
      # baselines in the first place — this restores CI's own resolution,
      # it does not invent a new one.
      #
      # Deliberately NOT fonts-jetbrains-mono, despite that being the stack
      # `.ascii-panel`'s CSS asks for: the grid lives in a `<code>` child,
      # and Chromium's UA stylesheet sets `code { font-family: monospace }`
      # directly on that element, which beats the inherited author value.
      # The named faces therefore never reach the grid and only restyle the
      # panel chrome — installing them measurably made the fail rate worse
      # (90/90). Same reasoning, at more length, in
      # docker/visual-regression.Dockerfile.
      - name: Install DejaVu fonts (generic monospace parity with ubuntu-latest)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-dejavu-core
          fc-cache -f

      # Carried over from docker/visual-regression.Dockerfile's build-time
      # assertion. A base-tag bump that silently changed font resolution
      # would otherwise surface only as ~90 mismatched screenshots, which
      # reads like a rendering regression in the renderer rather than a
      # problem with the image — and the tempting "fix" for that is
      # regenerating baselines, which is exactly what must not happen here.
      - name: Verify generic font families resolve to DejaVu
        run: |
          # Exact family match, not a `DejaVu*` glob: fonts-dejavu-core installs
          # DejaVu Sans (proportional), DejaVu Serif, and DejaVu Sans Mono
          # together, so a glob would also accept the proportional "DejaVu Sans"
          # face for the `monospace` generic - silently defeating this guard's
          # purpose (a monospace grid rendered in a proportional font) if
          # `monospace` ever misresolved to it.
          assert_family() {
            generic="$1"
            expected="$2"
            match="$(fc-match -f '%{family}' "$generic")"
            if [ "$match" != "$expected" ]; then
              echo "::error::fc-match $generic resolved to '$match', expected '$expected' — the fonts-dejavu-core step did not take effect. Do NOT regenerate baselines to make this job green."
              exit 1
            fi
          }
          assert_family monospace "DejaVu Sans Mono"
          assert_family sans-serif "DejaVu Sans"
          assert_family serif "DejaVu Serif"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Pinned to 22 even though the image ships a newer Node: SVG and ASCII
      # output are generated in Node (only DOM mounting happens in the
      # browser — see playwright.config.ts and __tests__/visual/helpers/),
      # so the Node version is part of what produced the baselines, and the
      # rest of this workflow's jobs are on 22.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `playwright install` and no actions/cache step: the container
      # already carries the Chrome-for-Testing build matching the pinned
      # @playwright/test version, at the $PLAYWRIGHT_BROWSERS_PATH the
      # image sets (/ms-playwright), and its system dependencies are baked
      # in. That is the same thing Playwright's own GitHub Actions container
      # example relies on (https://playwright.dev/docs/ci). It is also the
      # full Chrome-for-Testing binary rather than headless-shell — which
      # renders subtly differently in places — so this stays comparable to
      # the committed -linux.png baselines, the same property the old
      # `--only-shell`-avoiding install step was protecting.
      #
      # This suite runs under Playwright Test, not Vitest's browser mode —
      # see zombie-mermaid#299 for why: Vitest's Node<->browser RPC bridge
      # has an unfixed, still-open upstream bug (vitest-dev/vitest#10791)
      # that hung this exact job's CI runs (reproduced even on the
      # vitest@5.0.0-rc line meant to fix it). Playwright Test drives the
      # browser entirely from Node, so there's no such bridge to hang on.
      #
      # For ASCII samples this job only screenshots ascii-html.ts's browser/
      # HTML approximation of a terminal, never a real PTY — a passing run
      # here is not proof ASCII output is correct in an actual terminal (see
      # zombie-mermaid#348 and CONTRIBUTING.md's "Visual regression tests").
      #
      # --shard runs only this shard's slice of the suite; `pnpm run
      # test:visual` isn't used directly here since it doesn't forward
      # extra playwright args.
      - name: Run visual regression suite
        id: visual-tests
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      # One artifact per shard — upload-artifact v4 requires unique names
      # within a run, and each shard produces its own disjoint slice of
      # test-results/playwright-report anyway, so there's nothing to merge.
      - name: Upload failure report
        id: upload-report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-failures-${{ matrix.shardIndex }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Surfaces the failure directly on the check's Summary tab — one click
      # from the PR, no digging through the raw job log — with a direct link
      # to download the full interactive Playwright report (side-by-side
      # diffs + traces). This can't embed the interactive report itself:
      # actions/upload-artifact's browser-preview mode only renders a single
      # simple file with no external CSS/JS, and the Playwright HTML report
      # is a full app (its own JS bundle, trace/diff viewer data) — see #306
      # for the fuller evaluation of GitHub Pages / third-party hosting
      # options that could close that remaining gap.
      - name: Write visual regression summary
        if: failure() && steps.visual-tests.conclusion == 'failure'
        run: |
          {
            echo "## Visual regression failures (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"
            echo
            if [ -n "${{ steps.upload-report.outputs.artifact-url }}" ]; then
              echo "[Download the full interactive Playwright report](${{ steps.upload-report.outputs.artifact-url }}) (the \`visual-regression-failures-${{ matrix.shardIndex }}\` artifact) — extract it and run \`pnpm exec playwright show-report playwright-report\` for the side-by-side diff/trace viewer."
              echo
            fi
            echo "Failed screenshots:"
            echo
            diffs=$(find test-results -iname '*-diff.png' 2>/dev/null | sort || true)
            if [ -z "$diffs" ]; then
              echo "- (no per-screenshot diff files found — see the full report or job log for details)"
            else
              while IFS= read -r f; do
                echo "- \`${f#test-results/}\`"
              done <<< "$diffs"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    name: Benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs the benchmark; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmark
        run: pnpm run bench -- --json=bench-current.json

      # Gates against bench-baseline.json with a deliberately loose threshold
      # (see scripts/bench-compare.ts) — shared runners are noisy enough that
      # a tight threshold would flag CI variance rather than a real
      # regression. The goal is catching an accidental algorithmic blowup,
      # not micro-tuning render time.
      - name: Compare against baseline
        run: pnpm run bench:compare -- bench-current.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-result
          path: bench-current.json
          retention-days: 30

  bundle-size:
    name: Bundle size gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code, builds, and checks dist/ sizes; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build

      # Gates published dist/ output against bundle-size-budget.json — see
      # scripts/check-bundle-size.ts for why this is an in-house gzip check
      # rather than a size-limit/bundlewatch dependency, and how to raise a
      # budget after an intentional, reviewed size increase.
      - name: Check bundle size
        run: pnpm run check:bundle-size

  semgrep:
    name: Semgrep SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs a local scan; no SARIF upload, no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against.
    if: github.repository == 'dfadler/zombie-mermaid'

    container:
      # Official Semgrep image; runs entirely against Semgrep's free, public
      # rulesets (no SEMGREP_APP_TOKEN / Semgrep Cloud account required or used).
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `--config auto` pulls Semgrep's community rulesets keyed off the
      # languages detected in this repo (no account/token needed — verified
      # locally while logged out of Semgrep). `--error` makes the step fail
      # the build when findings are reported, rather than just logging them.
      #
      # Aikido is intentionally not run here: full Aikido SCA/secrets CI
      # scanning needs an Aikido account + API token, which the maintainer
      # doesn't have yet. See CONTRIBUTING.md for the local-only Aikido
      # Safe Chain setup that *is* wired in for this repo (install-time
      # malware/supply-chain protection, not something CI can gate on).
      - name: Run Semgrep
        run: semgrep scan --config auto --error

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and runs `pnpm changeset status`; no writes back to the repo
    # Same fork-of-this-fork guard as the `test` job above — see its comment
    # for the full reasoning on what github.repository resolves to and what
    # this does/doesn't protect against. (The additional event_name check
    # here is unrelated to that guard — it just skips this check on push
    # events, since a changeset is only relevant for a PR that hasn't
    # merged yet.) The final clause exempts the changesets/action Version
    # PR: it always modifies package.json/CHANGELOG.md while consuming (and
    # thus never adding) a changeset, so this check would otherwise fail on
    # every release. It's scoped to same-repo PRs (not just the branch name)
    # so a fork can't spoof the branch name to skip its own changeset check.
    if: >-
      github.repository == 'dfadler/zombie-mermaid' && github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # demo/ is never published (it's excluded from package.json's "files"
      # field), so a PR that only touches demo/ has no effect on the shipped
      # package and shouldn't be forced into a version bump + changelog
      # entry. Scoped to "every changed file is under demo/" rather than a
      # flat path-ignore so a PR that touches demo/ *and* src/ still requires
      # a changeset for the src/ change.
      - name: Check whether this PR only touches demo/
        id: diff_scope
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only origin/main...HEAD)"
          # awk, not `grep -c`, because grep -c exits 1 (a hard failure
          # under set -e) when the count is zero — exactly the demo-only
          # case this check needs to detect. awk always exits 0.
          non_demo_count="$(printf '%s\n' "$changed_files" | awk 'NF && $0 !~ /^demo\// { count++ } END { print count + 0 }')"
          if [ -z "$changed_files" ] || [ "$non_demo_count" -gt 0 ]; then
            echo "demo_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "demo_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changeset
        if: steps.diff_scope.outputs.demo_only != 'true'
        run: pnpm changeset status --since origin/main
