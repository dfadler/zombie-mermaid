name: Site vs npm drift

# Daily check that the live demo site's version (JSON-LD softwareVersion)
# hasn't fallen more than a day behind npm latest (#1574). A red run is the
# alert. Zero-dependency script, so no install step.
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # gh run list for the last successful pages.yml run

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'dfadler/zombie-mermaid'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Compare live site to npm latest
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://dfadler.github.io/zombie-mermaid/
          PACKAGE: zombie-mermaid
        run: |
          LAST_PAGES_SUCCESS=$(gh run list --workflow pages.yml --status success -L1 --json createdAt -q '.[0].createdAt' || true)
          export LAST_PAGES_SUCCESS
          node scripts/check-site-drift.mjs
