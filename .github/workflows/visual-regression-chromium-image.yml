name: Visual regression Chromium-only image (build & publish)

# Builds and pushes docker/visual-regression-chromium.Dockerfile to GHCR,
# then runs a throwaway `container:` job against the freshly-pushed image so
# its real "Initialize containers" (image pull) time can be sampled from
# `gh run view --json jobs` the same way
# docs/research/ci-container-job-vs-actions-cache-timing.md sampled the real
# `visual-regression` job's pull time in ci.yml.
#
# ORIGIN AND CURRENT ROLE
#
# Originally added to answer zombie-mermaid#737 - a speculative, low-priority
# follow-up to #729/#733's investigation into `visual-regression`'s
# container-init overhead - and deliberately NOT wired into
# `push`/`pull_request`, since #737's own scope was "build the image and
# measure it," not "adopt it" (docs/research/737-chromium-only-image-pull-timing.md
# has the resulting numbers).
#
# zombie-mermaid#868 adopted the image #737 built: `ci.yml`'s real
# `visual-regression` job now pins a digest this workflow's `build-and-push`
# job published (see that job's own comment for why it, not a new
# always-on-push workflow, remains the publish mechanism). That makes this
# workflow's `build-and-push` job a real CI dependency now, not just a
# measurement artifact - it is the only thing that produces the image
# `ci.yml` consumes. It stays `workflow_dispatch`-only rather than gaining an
# automatic trigger (e.g. on Dockerfile changes): re-pinning `ci.yml`'s
# digest is itself a manual step (the digest is copy-pasted into a comment
# there), so an auto-rebuilt image would silently stop matching what
# `ci.yml` actually pins - the same manual-bump-then-redigest pattern
# docker/visual-regression.Dockerfile's own base-tag comment already
# documents for the multi-browser image. Re-run this by hand (Actions tab ->
# this workflow -> "Run workflow") whenever the Dockerfile changes or the
# pinned Playwright/base-image version bumps, then update `ci.yml`'s digest
# to match.
#
# The `measure-pull-time` job below is no longer this workflow's primary
# purpose, but it costs nothing extra on a workflow_dispatch-only run and
# remains useful for a future re-measurement if the base image changes
# again - kept per #868's own explicit "keep for future re-measurement"
# option rather than deleted.
on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # A single, distinct tag (not a mutable `:latest`-style alias shared with
  # anything else) so this can never be confused with or clobber the old
  # multi-browser image the real `visual-regression` job used before #868
  # (mcr.microsoft.com/playwright). Per #737's own suggestion.
  IMAGE: ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only

jobs:
  build-and-push:
    name: Build and push chromium-only image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same fork-of-this-fork guard as ci.yml's jobs - see that workflow's
    # `test` job comment for the full reasoning.
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: read # only checks out code to read the Dockerfile
      packages: write # pushes the built image to this repo's GHCR
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tags
        run: echo "tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes two tags: the immutable per-run SHA tag (what the measurement
      # job below actually pulls, so a re-run of this workflow can't change
      # the image out from under a `run` that already started) and the
      # floating `visual-regression-chromium-only` tag (so anyone poking at
      # GHCR by hand, or a future PR revisiting this, can find "the current
      # one" without hunting through run history for a SHA).
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/visual-regression-chromium.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE }}:latest

  measure-pull-time:
    name: Measure GHCR pull time (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: read
      packages: read # pulls the image this job's build-and-push step just pushed
    # Mirrors ci.yml's `visual-regression` job's --ipc=host and 4-shard
    # matrix exactly, so the "Initialize containers" timing sampled here is
    # comparable to the real job's, not an apples-to-oranges single-container
    # pull. fail-fast: false for the same reason as ci.yml: one shard's
    # container failing to start (or a rendering mismatch - this image was
    # never suite-verified the way docker/visual-regression.Dockerfile was)
    # shouldn't cancel the other shards' timing samples.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    container:
      image: ${{ needs.build-and-push.outputs.tag }}
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is a TIMING measurement, not a correctness check: the point of
      # this job is the "Initialize containers" step duration GitHub records
      # before this step even starts, sampled afterward via `gh run view
      # --json jobs`. Whether the suite itself passes against this
      # never-suite-verified image is irrelevant to that number, so a
      # rendering mismatch here must not be read as this image being unfit
      # for anything - it was never validated against the committed
      # baselines the way docker/visual-regression.Dockerfile was (see that
      # file's own font-parity layer, copied here unverified). continue-on-
      # error keeps a mismatch from hiding this job's "Initialize containers"
      # timing behind a big red X.
      - name: Run visual regression suite (timing only, not a correctness gate)
        continue-on-error: true
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
