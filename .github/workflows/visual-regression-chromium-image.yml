name: Visual regression Chromium-only image (build & publish)

# Builds and pushes docker/visual-regression-chromium.Dockerfile to GHCR.
#
# ORIGIN AND CURRENT ROLE
#
# Originally added to answer zombie-mermaid#737 - a speculative, low-priority
# follow-up to #729/#733's investigation into `visual-regression`'s
# container-init overhead - and deliberately NOT wired into
# `push`/`pull_request`, since #737's own scope was "build the image and
# measure it," not "adopt it" (docs/research/737-chromium-only-image-pull-timing.md
# has the resulting numbers).
#
# zombie-mermaid#868 adopted the image #737 built: `ci.yml`'s real
# `visual-regression` job now pins a digest this workflow's `build-and-push`
# job published (see that job's own comment for why it, not a new
# always-on-push workflow, remains the publish mechanism). That makes this
# workflow's `build-and-push` job a real CI dependency now, not just a
# measurement artifact - it is the only thing that produces the image
# `ci.yml` consumes. It stays `workflow_dispatch`-only rather than gaining an
# automatic trigger (e.g. on Dockerfile changes): re-pinning `ci.yml`'s
# digest is itself a manual step (the digest is copy-pasted into a comment
# there), so an auto-rebuilt image would silently stop matching what
# `ci.yml` actually pins - the same manual-bump-then-redigest pattern
# docker/visual-regression.Dockerfile's own base-tag comment already
# documents for the multi-browser image. Re-run this by hand (Actions tab ->
# this workflow -> "Run workflow") whenever the Dockerfile changes or the
# pinned Playwright/base-image version bumps, then update `ci.yml`'s digest
# to match.
#
on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # A single, distinct tag (not a mutable `:latest`-style alias shared with
  # anything else) so this can never be confused with or clobber the old
  # multi-browser image the real `visual-regression` job used before #868
  # (mcr.microsoft.com/playwright). Per #737's own suggestion.
  IMAGE: ghcr.io/dfadler/zombie-mermaid/visual-regression-chromium-only

jobs:
  build-and-push:
    name: Build and push chromium-only image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same fork-of-this-fork guard as ci.yml's jobs - see that workflow's
    # `test` job comment for the full reasoning.
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: read # only checks out code to read the Dockerfile
      packages: write # pushes the built image to this repo's GHCR
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tags
        run: echo "tag=${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes two tags: the immutable per-run SHA tag (what ci.yml pins by
      # digest, so a re-run of this workflow can't change the image) and the
      # floating `visual-regression-chromium-only` tag (so anyone poking at
      # GHCR by hand, or a future PR revisiting this, can find "the current
      # one" without hunting through run history for a SHA).
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/visual-regression-chromium.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE }}:latest
