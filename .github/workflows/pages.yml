name: Deploy demo site to GitHub Pages

# Builds the static demo site (index.ts/editor.ts -> site/) and publishes it
# to GitHub Pages on every push to main. Requires the repo's Pages source to
# be set to "GitHub Actions" (Settings -> Pages) — this workflow's deploy
# step fails otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment should ever be in flight; a mid-flight cancel
# would leave Pages serving a half-uploaded artifact, so unlike ci.yml this
# does not cancel-in-progress (same reasoning as publish.yml).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out code and builds the static site
    # Same fork-of-this-fork guard as ci.yml/publish.yml — see ci.yml's
    # `test` job comment for the full reasoning.
    if: github.repository == 'dfadler/zombie-mermaid'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: fork-fixes.ts renders each "before" by extracting
          # the source tree at a historical commit, which a shallow checkout
          # does not contain.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      pages: write # required to deploy to GitHub Pages
      id-token: write # required for Pages deployment authentication (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
