name: Release

# Runs on every push to main. changesets/action inspects the repo and picks
# one of two modes:
#   - Pending changesets exist  -> opens/updates a "Version Packages" PR that
#     bumps package.json + CHANGELOG.md from the pending .changeset/*.md files.
#   - No pending changesets, but versions were just bumped (i.e. the Version
#     PR was just merged) -> runs the publish step, which publishes to npm
#     via trusted publishing (OIDC) and tags the release.
#
# See docs/RELEASING.md for the full flow and the one-time npmjs.com trusted
# publisher setup this depends on. As of #622, `pnpm changeset publish`
# below publishes six packages (the `zombie-mermaid` umbrella plus five
# @zombie-mermaid/* internal packages, kept on one version by
# .changeset/config.json's `fixed` group) instead of one — each needs its
# own trusted-publisher link configured on npmjs.com (same GitHub Actions
# values, repeated per package name; see docs/RELEASING.md's "One-time
# manual setup" section). No change needed in this workflow file itself for
# that: `changesets/action`/`pnpm changeset publish` already iterate every
# workspace package with a pending version bump.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same fork-of-this-fork guard pattern as ci.yml (see the `test` job's
    # comment there for the full reasoning on what github.repository
    # resolves to and what this class of guard does/doesn't protect
    # against). Specific to this workflow: the trigger is
    # `push: branches: [main]`, not a pull_request event, so the "does this
    # skip CI on PRs from forks" question doesn't apply here at all — that
    # concern is about pull_request runs, and this job never runs on one.
    #
    # What this guard actually prevents: GitHub copies workflow files into
    # forks, and `push` events do fire in a fork's own Actions runs once its
    # owner does the one-time manual "enable Actions" step and pushes to
    # their own `main`. Without this guard, a downstream fork's own pushes
    # would also run changesets/action there, attempting to open a
    # "Version Packages" PR against their fork (which would actually
    # succeed, using their own GITHUB_TOKEN and the permissions block
    # below) and, once a Version PR is merged, attempting an npm
    # trusted-publish — which would fail, since npm's trusted-publisher
    # trust relationship is scoped to this exact repo/workflow and would
    # reject an OIDC token asserting a different repo as the subject. So
    # this guard isn't redundant with the trigger: it stops surprising,
    # partially-successful release automation from running unasked-for in
    # someone else's fork.
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: write # changesets/action commits/pushes the Version PR and tags
      pull-requests: write # changesets/action opens/updates the Version PR
      id-token: write # required for npm trusted publishing (OIDC)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      badge-changed: ${{ steps.badge-diff.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Run tests
        run: pnpm test

      - name: Type check
        # Runs both the library config and demo/tsconfig.json — the demo's
        # client-side code needs DOM types the root config deliberately omits,
        # so it is checked under its own config rather than weakening the
        # root's guarantees for library source.
        run: pnpm run typecheck

      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: publishing uses npm trusted
          # publishing (OIDC), authenticated via the id-token permission
          # above plus the trusted-publisher link configured on npmjs.com.

      # Runs only on an actual npm publish (not on the "open/update the
      # Version PR" branch of changesets/action above) — the badge should
      # track what was actually shipped, not every merge to main. Rebuilds
      # from the just-published, just-versioned source (the publish step
      # above already built once, but its dist/ doesn't survive between
      # steps) so the measured size matches the published package exactly.
      - name: Rebuild for badge measurement
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run build

      - name: Update bundle-size badge data
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run badge:bundle-size

      # main's branch protection now requires a PR plus 4 passing status
      # checks ("test", "Build site generator check", "Semgrep SAST scan",
      # "Changeset present") — this job's own `contents: write` token can no
      # longer push straight to main (GH006, same failure dashboard-
      # refresh.yml's header comment documents). See the run this broke on:
      # https://github.com/dfadler/zombie-mermaid/actions/runs/35637842580
      # Fixed the same way: hand the changed file to a separate job that
      # opens a PR via the DASHBOARD_REFRESH_PAT secret instead of pushing
      # directly (below).
      - name: Check for badge change
        id: badge-diff
        if: steps.changesets.outputs.published == 'true'
        run: |
          if git diff --quiet -- badges/bundle-size.json; then
            echo "Bundle size unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload badge artifact
        if: steps.badge-diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-size-badge
          path: badges/bundle-size.json
          retention-days: 1

  commit-badge-data:
    name: Open bundle-size badge PR
    needs: release
    if: needs.release.outputs.published == 'true' && needs.release.outputs.badge-changed == 'true' && github.repository == 'dfadler/zombie-mermaid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # pushes via DASHBOARD_REFRESH_PAT below, not the job token

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No `pnpm install` (or anything else that executes third-party code)
      # in this job — same rationale as dashboard-refresh.yml's open-pr job:
      # keeps the repo-writing PAT out of a job that runs arbitrary
      # dependency lifecycle scripts.
      - name: Download badge artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-size-badge
          path: badges

      - name: Commit, push, and open PR
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_REFRESH_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DASHBOARD_REFRESH_PAT secret is not set — see dashboard-refresh.yml's header comment for why the default GITHUB_TOKEN can't be used here."
            exit 1
          fi

          # Empty changeset satisfies the "Changeset present" required
          # check without claiming a version bump — a badge-data update
          # isn't itself a release-worthy change. Hand-written (not `pnpm
          # changeset add --empty`) since this job has no changesets CLI
          # installed (see step comment above).
          mkdir -p .changeset
          printf -- '---\n---\n' > ".changeset/bundle-size-badge-${GITHUB_RUN_ID}.md"

          BRANCH="chore/bundle-size-badge-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add badges/bundle-size.json .changeset
          git commit -m 'chore: update bundle-size badge data'

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title 'chore: update bundle-size badge data' \
            --body 'Automated bundle-size badge refresh after a release (publish.yml). Includes an empty changeset — this is a data update, not a release-worthy change. Merge once checks pass.'
