name: Release

# Runs on every push to main. changesets/action inspects the repo and picks
# one of two modes:
#   - Pending changesets exist  -> opens/updates a "Version Packages" PR that
#     bumps package.json + CHANGELOG.md from the pending .changeset/*.md files.
#   - No pending changesets, but versions were just bumped (i.e. the Version
#     PR was just merged) -> runs the publish step, which publishes to npm
#     via trusted publishing (OIDC) and tags the release.
#
# See RELEASING.md for the full flow and the one-time npmjs.com trusted
# publisher setup this depends on.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same fork-of-this-fork guard pattern as ci.yml (see the `test` job's
    # comment there for the full reasoning on what github.repository
    # resolves to and what this class of guard does/doesn't protect
    # against). Specific to this workflow: the trigger is
    # `push: branches: [main]`, not a pull_request event, so the "does this
    # skip CI on PRs from forks" question doesn't apply here at all — that
    # concern is about pull_request runs, and this job never runs on one.
    #
    # What this guard actually prevents: GitHub copies workflow files into
    # forks, and `push` events do fire in a fork's own Actions runs once its
    # owner does the one-time manual "enable Actions" step and pushes to
    # their own `main`. Without this guard, a downstream fork's own pushes
    # would also run changesets/action there, attempting to open a
    # "Version Packages" PR against their fork (which would actually
    # succeed, using their own GITHUB_TOKEN and the permissions block
    # below) and, once a Version PR is merged, attempting an npm
    # trusted-publish — which would fail, since npm's trusted-publisher
    # trust relationship is scoped to this exact repo/workflow and would
    # reject an OIDC token asserting a different repo as the subject. So
    # this guard isn't redundant with the trigger: it stops surprising,
    # partially-successful release automation from running unasked-for in
    # someone else's fork.
    if: github.repository == 'dfadler/zombie-mermaid'
    permissions:
      contents: write # changesets/action commits/pushes the Version PR and tags
      pull-requests: write # changesets/action opens/updates the Version PR
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm changeset version
          publish-script: pnpm changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: publishing uses npm trusted
          # publishing (OIDC), authenticated via the id-token permission
          # above plus the trusted-publisher link configured on npmjs.com.
