name: Setup pnpm + Node.js + install
description: >-
  pnpm, Node.js (with the pnpm store cache) and `pnpm install --frozen-lockfile`.
  The caller must run actions/checkout first: a local action is read from the
  checked-out tree. pnpm's version comes from package.json `packageManager`.

inputs:
  node-version-file:
    description: File holding the Node.js version. Ignored when node-version is set.
    default: .nvmrc
  node-version:
    description: Explicit Node.js version (overrides node-version-file), e.g. a matrix value.
    default: ''
  registry-url:
    description: npm registry URL to configure for publishing (empty = leave unset).
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
