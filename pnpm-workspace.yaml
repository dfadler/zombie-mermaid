# Workspace packages (zombie-mermaid#620's monorepo conversion). `packages/*`
# are `"private": true` and bundled into the umbrella's `dist/` by
# `vite.config.lib.ts`, so they are never published and never appear in the
# published `zombie-mermaid`'s runtime dependency tree — see #625.
#
# `.` (the repo root) is listed explicitly even though pnpm itself always
# treats the root as part of the workspace with or without it. Changesets'
# workspace resolution does not: `@manypkg/get-packages`, which
# `@changesets/cli` uses to resolve changeset package names, always returns
# the pnpm workspace root as a separate `rootPackage`, never as a member of
# `packages` — regardless of what the `packages:` glob matches. Without `.`
# here, `packagesByName` (built from `packages.packages` only) never
# contains `zombie-mermaid`, so any changeset naming it fails with "Found
# changeset ... for package zombie-mermaid which is not in the workspace"
# the moment `packages:` became non-empty (#625). Confirmed by reproducing
# against a clean `main` checkout before this fix.
#
# Defining `packages:` makes Semgrep's pnpm supply-chain rules apply to this
# file for the first time (they don't fire on a non-workspace config). #656
# resolved the two policy violations that blocked turning these settings on:
# `undici-types@6.21.0` (a transitive dep of `@types/node`) tripped
# `trustPolicy`'s TRUST_DOWNGRADE check because it predates undici's adoption
# of npm provenance/trusted publishing — the `overrides` entry below pins it
# to `6.28.0`, a same-major, provenance-attested release from the same
# maintainers, which clears the check for real. `@types/react-dom@19.2.7`
# tripped `minimumReleaseAge` for still being within its 7-day cutoff at the
# time this landed; see the `minimumReleaseAgeExclude` entry below.
packages:
  - '.'
  - 'packages/*'

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@types/react-dom@19.2.7'
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0

overrides:
  '@types/node>undici-types': 6.28.0

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
