# Workspace packages (zombie-mermaid#620's monorepo conversion). The repo
# root itself is always a workspace package for pnpm and is not listed here.
# `packages/*` are `"private": true` and bundled into the umbrella's `dist/`
# by `vite.config.lib.ts`, so they are never published and never appear in
# the published `zombie-mermaid`'s runtime dependency tree — see #625.
#
# Defining `packages:` makes Semgrep's pnpm supply-chain rules apply to this
# file for the first time (they don't fire on a non-workspace config). The
# three settings below are deliberately deferred, not overlooked: enabling
# them fails `pnpm install --frozen-lockfile` against the current lockfile
# (an existing `undici-types@6.21.0` entry trips `trustPolicy`'s
# TRUST_DOWNGRADE check, and `@types/react-dom@19.2.7` trips
# `minimumReleaseAge`) and that needs its own investigation, not a
# monorepo-refactor PR. Tracked in #656.
# nosemgrep: package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies, package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age, package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
packages:
  - 'packages/*'

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0
